[load_balancer]
# The legacy 'octavia' alias is absent from octavia_provider_drivers.
provider = amphora
# The all-in-one has no shared IPv6 subnet pool.
test_with_ipv6 = False
# Must outlast Octavia's own amp_active_retries * amp_active_wait_sec of 900s.
lb_build_timeout = 1200
# Listener and pool waits.
build_timeout = 900
# Member add waits.
check_timeout = 600
# With port_security below, makes the plugin attach a security group to backends.
enable_security_groups = True

[network-feature-enabled]
port_security = True
