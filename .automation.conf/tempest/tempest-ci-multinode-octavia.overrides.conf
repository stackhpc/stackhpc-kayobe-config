# Copy of tempest-ci-multinode.overrides.conf with the [load_balancer] and
# [network-feature-enabled] sections appended; keep the shared parts in sync.
# The filename is dictated by config.sh and cannot be made more descriptive.

[DEFAULT]
openstack_client_http_timeout = 300

[auth]
compute_quotas = cores:-1,ram:-1

[identity]
v3_endpoint_type = publicURL

[compute]
min_compute_nodes = 2
min_microversion = 2.1
max_microversion = 2.96

[service-clients]
http_timeout = 600

[compute-feature-enabled]
resize = true
live_migration = true
block_migration_for_live_migration = false
volume_backed_live_migration = true
console_output = true

[volume]
storage_protocol = ceph
build_timeout = 600
min_microversion = 3.0
max_microversion = 3.71

[image]
build_timeout = 600

[dashboard]
dashboard_url = https://192.168.39.2

[load_balancer]
# The legacy 'octavia' alias is absent from octavia_provider_drivers.
provider = amphora
# This environment has no shared IPv6 subnet pool.
test_with_ipv6 = False
# Must outlast Octavia's own amp_active_retries * amp_active_wait_sec of 900s.
lb_build_timeout = 1200
# Listener and pool waits.
build_timeout = 900
# Member add waits.
check_timeout = 600
# With port_security below, makes the plugin attach a security group to backends.
enable_security_groups = True

[network-feature-enabled]
port_security = True
