---
# This file is a list of rules for .github/workflows/stackhpc-release-note-check.yml.
# Each entry is an extended regex matched against the paths changed by a PR.

# A PR that changes any of these paths must add a release note.
needs_note:
  - '^etc/kayobe/kolla-image-tags\.yml$'
  - '^etc/kayobe/pulp-repo-versions\.yml$'
  - '^etc/kayobe/kolla/'

# A PR that *only* changes these paths must not add a release note.
no_note:
  - '^doc/'
  - '^\.github/'
  - '^etc/kayobe/environments/ci-[^/]*/'
