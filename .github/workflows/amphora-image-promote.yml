---
name: Promote Amphora image
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Tag to promote. Defaults to the tag in configuration.
        type: string
        required: false
        default: ''
env:
  ANSIBLE_FORCE_COLOR: True
jobs:
  amphora-image-promote:
    name: Promote Amphora image
    if: github.repository == 'stackhpc/stackhpc-kayobe-config'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: src/kayobe-config

      - name: Determine OpenStack release
        id: openstack_release
        run: |
          BRANCH=$(awk -F'=' '/defaultbranch/ {print $2}' src/kayobe-config/.gitreview)
          echo "BRANCH=$BRANCH" >> $GITHUB_OUTPUT
          echo "openstack_release=${BRANCH}" | sed -E "s,(stable|unmaintained)/,," >> $GITHUB_OUTPUT

      # The tag defaults to the one in configuration, so that a routine promote
      # cannot publish an image the configuration does not reference. The input
      # overrides it, for cases such as rolling back to an earlier image which
      # would have more steps if manual promotion was removed completely.
      - name: Gather Amphora image tag
        id: amphora_image_tag
        run: |
          config_tag=$(grep ^stackhpc_amphora_image_version: etc/kayobe/stackhpc.yml | awk '{print $2}' | tr -d '"')
          if [[ -n "$OVERRIDE_TAG" ]]; then
            echo "Promoting $OVERRIDE_TAG (override; configuration references $config_tag)"
            echo "image_tag=$OVERRIDE_TAG" >> $GITHUB_OUTPUT
          else
            echo "Promoting $config_tag (from configuration)"
            echo "image_tag=$config_tag" >> $GITHUB_OUTPUT
          fi
        working-directory: src/kayobe-config
        env:
          OVERRIDE_TAG: ${{ inputs.image_tag }}

      - name: Setup networking
        run: |
          if ! ip l show breth1 >/dev/null 2>&1; then
              sudo ip l add breth1 type bridge
          fi
          sudo ip l set breth1 up
          if ! ip a show breth1 | grep 192.168.33.3/24; then
              sudo ip a add 192.168.33.3/24 dev breth1
          fi
          if ! ip l show dummy1 >/dev/null 2>&1; then
              sudo ip l add dummy1 type dummy
          fi
          sudo ip l set dummy1 up
          sudo ip l set dummy1 master breth1

      - name: Install Kayobe
        run: |
          mkdir -p venvs &&
          pushd venvs &&
          python3 -m venv kayobe &&
          source kayobe/bin/activate &&
          pip install -U pip &&
          pip install -r ../src/kayobe-config/requirements.txt

      - name: Bootstrap the control host
        run: |
          source venvs/kayobe/bin/activate &&
          source src/kayobe-config/kayobe-env --environment ci-builder &&
          kayobe control host bootstrap
        env:
          KAYOBE_VAULT_PASSWORD: ${{ secrets.KAYOBE_VAULT_PASSWORD_CI_BUILDER }}

      - name: Promote Amphora image artifact
        run: |
          source venvs/kayobe/bin/activate &&
          source src/kayobe-config/kayobe-env --environment ci-builder &&
          kayobe playbook run \
          src/kayobe-config/etc/kayobe/ansible/pulp/pulp-artifact-promote.yml \
          -e repository_name="amphora-images-${{ steps.openstack_release.outputs.openstack_release }}" \
          -e pulp_base_path="amphora-images/${{ steps.openstack_release.outputs.openstack_release }}"
        env:
          ARTIFACT_TAG: ${{ steps.amphora_image_tag.outputs.image_tag }}
          KAYOBE_VAULT_PASSWORD: ${{ secrets.KAYOBE_VAULT_PASSWORD_CI_BUILDER }}
