---
# This workflow queries the Test Pulp server to check that all image tags
# specified in kolla_image_tags are present.

name: Check container image tags
on:
  workflow_call:
    inputs:
      kayobe_image:
        description: Kayobe container image
        type: string
        required: true
      if:
        description: Whether to run the workflow (workaround for required status checks issue)
        type: boolean
        default: true
    secrets:
      # NOTE: Secrets are optional so that the workflow can be skipped cleanly
      # (via the 'if' input) on pull requests from forks, which receive no secrets.
      KAYOBE_VAULT_PASSWORD:
        required: false

env:
  ANSIBLE_FORCE_COLOR: True
jobs:
  check-tags:
    name: Check container image tags
    if: ${{ inputs.if && ! cancelled() }}
    # Use a GitHub-hosted runner for pull requests from forks; the job fails
    # immediately in that case (see below).
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || 'arc-skc-aio-runner' }}
    permissions: {}
    env:
      KAYOBE_ENVIRONMENT: ci-aio
      KAYOBE_VAULT_PASSWORD: ${{ secrets.KAYOBE_VAULT_PASSWORD }}
      KAYOBE_IMAGE: ${{ inputs.kayobe_image }}
    steps:
      # Pull requests from forks do not have access to secrets. Fail early
      # rather than skipping
      - name: Fail for pull requests from forks
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::This pull request is from a fork, so it does not have access to the secrets needed for this job. A maintainer must run this CI before the pull request can be merged."
          exit 1

      - name: Install package dependencies
        run: |
          sudo apt update
          sudo apt install -y git unzip nodejs

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      # The same tag may be reused (e.g. pr-123), so ensure we have the latest image.
      - name: Pull latest Kayobe image
        run: |
          docker image pull $KAYOBE_IMAGE

      - name: Check kolla-images.py image map and tag hierarchy
        run: |
          docker run -t --rm \
            -v $(pwd):/stack/kayobe-automation-env/src/kayobe-config \
            -e KAYOBE_ENVIRONMENT -e KAYOBE_VAULT_PASSWORD -e KAYOBE_AUTOMATION_SSH_PRIVATE_KEY \
            $KAYOBE_IMAGE \
            /stack/kayobe-automation-env/src/kayobe-config/.automation/pipeline/playbook-run.sh \
            '$KAYOBE_CONFIG_PATH/ansible/tools/check-kolla-images-py.yml'

      - name: Check container image tags
        run: |
          docker run -t --rm \
            -v $(pwd):/stack/kayobe-automation-env/src/kayobe-config \
            -e KAYOBE_ENVIRONMENT -e KAYOBE_VAULT_PASSWORD -e KAYOBE_AUTOMATION_SSH_PRIVATE_KEY \
            $KAYOBE_IMAGE \
            /stack/kayobe-automation-env/src/kayobe-config/.automation/pipeline/playbook-run.sh \
            '$KAYOBE_CONFIG_PATH/ansible/tools/check-tags.yml'
