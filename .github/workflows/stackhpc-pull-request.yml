      os_release: jammy
      ssh_username: ubuntu
      neutron_plugin: ovn
      OS_CLOUD: openstack
      if: ${{ needs.check-changes.outputs.aio == 'true' }}
      upgrade: true
      user-ssh-public-key: "ssh-rsa "
    secrets: inherit
    if: ${{ ! failure() && ! cancelled() && github.repository == 'stackhpc/stackhpc-kayobe-config' }}

