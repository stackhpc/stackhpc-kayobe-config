name: Merge request - release

on:
  workflow_dispatch:

jobs:
  branch-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    name: Propose release
    steps:
      - name: Fail if branch is not rc
        if: ${{ !startsWith(github.ref_name, 'stackhpc-rc') }}
        run: |
          echo "This workflow should not be triggered on non-RC branches"
          exit 1

      - name: Set branch names
        id: branches
        env:
          RC: ${{ github.ref_name }}
        run: |
          release="${RC#stackhpc-rc/}"
          echo "rc=${RC}" >> "$GITHUB_OUTPUT"
          echo "stable=stackhpc/${release}" >> "$GITHUB_OUTPUT"

      - name: Checkout Kayobe-config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.outputs.branches.stable }}
          fetch-depth: 0
          path: src/kayobe-config

      - name: Set up branch and Git config
        run: |
          git checkout -b ${{ steps.outputs.branches.rc }}
          git config user.name "stackhpc-ci"
          git config user.email "22933334+stackhpc-ci@users.noreply.github.com"
        working-directory: src/kayobe-config

      - name: Ensure release candidate branch exists
        run: git push origin ${{ steps.outputs.branches.rc }}
        working-directory: src/kayobe-config

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: src/kayobe-config
        run: |
          EXISTING_PR=$(gh pr list --head "${{ steps.outputs.branches.rc }}" --json number -q '.[0].number')
          if [ -n "$EXISTING_PR" ]; then
            gh pr close $EXISTING_PR
          fi
          gh pr create \
            --base "${{ steps.outputs.branches.stable }}" \
            --head "${{ steps.outputs.branches.rc }}" \
            --title "(automated) Stable release for OpenStack ${{ steps.outputs.branches.stable }}" \
            --label "automated" \
