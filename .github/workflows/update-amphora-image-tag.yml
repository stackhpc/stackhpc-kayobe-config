---
name: Update Amphora image tag

on:
  workflow_dispatch:
    inputs:
      amphora_tag:
        description: Octavia Amphora image tag
        type: string
        required: true

jobs:
  propose_amphora_image_tag_update:
    if: github.repository == 'stackhpc/stackhpc-kayobe-config'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    name: Update Amphora image tag
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          path: ${{ github.workspace }}/src/kayobe-config

      # The tag is passed via the environment rather than interpolated into the
      # script, to avoid the input being evaluated as shell.
      - name: Update Amphora image tag
        run: |
          sed -i "/^stackhpc_amphora_image_version:/s/.*/stackhpc_amphora_image_version: \"$AMPHORA_TAG\"/" etc/kayobe/stackhpc.yml
          grep ^stackhpc_amphora_image_version: etc/kayobe/stackhpc.yml
        working-directory: ${{ github.workspace }}/src/kayobe-config
        env:
          AMPHORA_TAG: ${{ inputs.amphora_tag }}

      - name: Propose changes via PR if required
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          path: ${{ github.workspace }}/src/kayobe-config
          commit-message: >-
            Bump Octavia Amphora image tag
          author: stackhpc-ci <22933334+stackhpc-ci@users.noreply.github.com>
          branch: bump-amphora-image-${{ inputs.amphora_tag }}
          delete-branch: true
          title: >-
            Bump Octavia Amphora image tag
          body: |
            This PR was created automatically to update the Octavia Amphora
            image tag.

            Amphora image: ${{ inputs.amphora_tag }}

            Remember to run the Promote Amphora image workflow before merging,
            otherwise deployments cannot download this image.
          labels: |
            automated
