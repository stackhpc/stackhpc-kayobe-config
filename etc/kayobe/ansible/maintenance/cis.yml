---
- name: CIS - Prerequisites
  hosts: cis-hardening
  become: true
  tags:
    - cis
  tasks:
    # TODO: Remove this when Red Hat FIPS policy has been updated to allow ed25519 keys.
    # https://gitlab.com/gitlab-org/gitlab/-/issues/367429#note_1840422075
    - name: Assert that we are using a supported SSH key
      ansible.builtin.assert:
        that:
          - ssh_key_type != 'ed25519'
        fail_msg: FIPS policy does not currently support ed25519 SSH keys on RHEL family systems
      when: ansible_facts.os_family == 'RedHat' and rhel9cis_crypto_policy == 'FIPS'

    - name: Ensure the cron package is installed on ubuntu
      ansible.builtin.package:
        name: cron
        state: present
      when: ansible_facts.distribution == 'Ubuntu'

    - name: Gather passwd entries
      ansible.builtin.getent:
        database: passwd
      become: true

    - name: Ensure service accounts have no expiry options set
      # This is to workaround an issue where we set the expiry to 365 days on kayobe
      # service accounts in a previous iteration of the CIS benchmark hardening
      # defaults. This should restore the defaults and can eventually be removed.
      ansible.builtin.user:
        name: "{{ item }}"
        password_expire_min: 0
        password_expire_max: 99999
        password_expire_warn: 7
        expires: -1
      become: true
      loop:
        - "{{ kayobe_ansible_user }}"
        - "{{ kolla_ansible_user }}"
      when: item in ansible_facts.getent_passwd

- name: Security hardening
  hosts: cis-hardening
  become: true
  tags:
    - cis
  tasks:
    - name: Run CIS hardening role (RHEL 9)
      ansible.builtin.include_role:
        name: ansible-lockdown.rhel9_cis
      when: ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version == '9'

    - name: Run CIS hardening role (RHEL 10)
      ansible.builtin.include_role:
        name: ansible-lockdown.rhel10_cis
      when: ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version == '10'

    - name: Run CIS hardening role (Ubuntu 24)
      ansible.builtin.include_role:
        name: ansible-lockdown.ubuntu24_cis
      when: ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_major_version == '24'
