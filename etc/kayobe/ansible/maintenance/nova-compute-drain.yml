---
- name: Drain a nova compute host of instances
  hosts: compute
  gather_facts: true
  tags:
    - nova-compute-drain
  vars:
    venv: "{{ virtualenv_path }}/openstack"
    migration_fatal: true
    nova_compute_drain_live_migration: true
    nova_compute_drain_destination: ""
  tasks:
    - name: Set up openstack cli virtualenv
      ansible.builtin.pip:
        virtualenv: "{{ venv }}"
        virtualenv_command: /usr/bin/python3 -m venv
        name:
          - python-openstackclient
        state: latest
        extra_args: "{% if pip_upper_constraints_file %}-c {{ pip_upper_constraints_file }}{% endif %}"
      run_once: true
      delegate_to: "{{ groups['controllers'][0] }}"
      vars:
        ansible_host: "{{ hostvars[groups['controllers'][0]].ansible_host }}"

    - name: Migrate instances
      delegate_to: "{{ groups['controllers'][0] }}"
      environment: "{{ openstack_auth_env }}"
      when:
        - "'compute' in group_names"
        - groups['compute'] | length > 1
      vars:
        ansible_host: "{{ hostvars[groups['controllers'][0]].ansible_host }}"
      block:
        - name: Query instances
          ansible.builtin.command: >
            {{ venv }}/bin/openstack
            server list --host {{ ansible_facts.nodename }}
            --all-projects
            --status ACTIVE
            --format json
          register: instances

        - name: "{{ 'Live migrate instances' if (nova_compute_drain_live_migration | bool) else 'Cold migrate instances' }}"
          ansible.builtin.command: >
            {{ venv }}/bin/openstack
            {% if nova_compute_drain_live_migration | bool %}--os-compute-api-version 2.25{% endif %}
            server migrate
            {{ instance_uuid }}
            {% if nova_compute_drain_live_migration | bool %}--live-migration{% endif %}
            {% if nova_compute_drain_destination | default('', true) %}--host {{ nova_compute_drain_destination }}{% endif %}
            --wait
          loop: "{{ instances.stdout | from_json }}"
          loop_control:
            label: "{{ instance_uuid }}"
          vars:
            instance_uuid: "{{ item.ID | default }}"
          register: result
          failed_when:
            - migration_fatal | bool
            - result is failed

        - name: Query instances
          ansible.builtin.command: >
            {{ venv }}/bin/openstack
            server list --host {{ ansible_facts.nodename }}
            --all-projects
            --status ACTIVE
            --format json
          register: instances

        - name: Fail if there are instances still on the host
          ansible.builtin.fail:
            msg: >
              Instances still on {{ inventory_hostname }}: {{ instances.stdout | from_json }}
          when:
            - migration_fatal | bool
            - instances.stdout | from_json | length > 0
