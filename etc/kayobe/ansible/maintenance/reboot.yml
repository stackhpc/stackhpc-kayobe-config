---
- name: Reboot the host
  hosts: "{{ reboot_hosts | default('seed-hypervisor:seed:overcloud:infra-vms') }}"
  serial: "{{ lookup('env', 'ANSIBLE_SERIAL') | default(1, true) }}"
  gather_facts: false
  vars:
    reboot_timeout_s: "{{ 20 * 60 }}"
    post_reboot_delay_s: 5 # Extra delay to ensure SSH is working reliably
    reboot_with_bootstrap_user: false
    ansible_user: "{{ bootstrap_user if reboot_with_bootstrap_user | bool else kayobe_ansible_user }}"
    ansible_ssh_common_args: "{{ '-o StrictHostKeyChecking=no' if reboot_with_bootstrap_user | bool else '' }}"
    ansible_python_interpreter: /usr/bin/python3
    confirm_reboot: false
  tags:
    - reboot
  tasks:
    - name: Prompt to confirm reboot
      ansible.builtin.pause:
        prompt: >
          The following hosts will be rebooted:
          {{ play_hosts | join(', ') }}
          If you want to proceed type: yes
      register: pause_prompt
      when: not confirm_reboot

    - name: Fail if reboot is not confirmed
      ansible.builtin.assert:
        that: confirm_reboot | bool or pause_prompt.user_input == 'yes'
        msg: >
          Reboot has not been confirmed. You must either type 'yes' when
          prompted, or set ``confirm_reboot: true``.

    - name: Reboot and wait
      become: true
      ansible.builtin.reboot:
        post_reboot_delay: "{{ post_reboot_delay_s | int }}"
        reboot_timeout: "{{ reboot_timeout_s | int }}"
        search_paths:
          # Systems running molly-guard hang waiting for confirmation before rebooting without this.
          - /lib/molly-guard
          # Default list:
          - /sbin
          - /bin
          - /usr/sbin
          - /usr/bin
          - /usr/local/sbin
