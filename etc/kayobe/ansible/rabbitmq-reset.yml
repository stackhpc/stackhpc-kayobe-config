---
# Reset a broken RabbitMQ cluster.
# Also restarts all OpenStack services using RabbitMQ.

- name: Reset RabbitMQ
  hosts: controllers
  become: true
  gather_facts: false
  tags:
    - rabbitmq-reset
  vars:
    container_name: rabbitmq
  tasks:
    - name: Checking timedatectl status
      ansible.builtin.command: timedatectl status
      register: timedatectl_status
      changed_when: false

    - name: Fail if the clock is not synchronized
      ansible.builtin.fail:
        msg: >-
          timedatectl sees the system clock as unsynchronized.
          You may need to force synchronisation using `chronyc makestep`.
          Otherwise, please wait for synchronization.
      when:
        - "'synchronized: yes' not in timedatectl_status.stdout"

    - name: Inspect the {{ container_name }} container
      ansible.builtin.shell:
        cmd: docker container inspect --format '{{ '{{' }} .State.Running {{ '}}' }}' {{ container_name }}
      register: inspection

    - name: Ensure the {{ container_name }} container is running
      ansible.builtin.command: systemctl start kolla-{{ container_name }}-container.service # noqa command-instead-of-module
      when: inspection.stdout == 'false'

    - name: Wait for the {{ container_name }} container to reach state 'Running'
      ansible.builtin.shell:
        cmd: docker container inspect --format '{{ '{{' }} .State.Running {{ '}}' }}' {{ container_name }}
      register: result
      until: result.stdout == 'true'
      retries: 10
      delay: 6

    - name: Wait for the rabbitmq node to automatically start on container start
      ansible.builtin.command: docker exec {{ container_name }} /bin/bash -c 'rabbitmqctl wait /var/lib/rabbitmq/mnesia/rabbitmq.pid --timeout 60'
      when: inspection.stdout == 'false'

    - name: Stop app
      ansible.builtin.command: docker exec {{ container_name }} /bin/bash -c 'rabbitmqctl stop_app'

    - name: Force reset app
      ansible.builtin.command: docker exec {{ container_name }} /bin/bash -c 'rabbitmqctl force_reset'

    - name: Start app
      ansible.builtin.command: docker exec {{ container_name }} /bin/bash -c 'rabbitmqctl start_app'

    - name: Wait for all nodes to join the cluster
      ansible.builtin.command: docker exec {{ container_name }} /bin/bash -c 'rabbitmqctl await_online_nodes {{ groups['controllers'] | length }}'

- name: Restart OpenStack services
  hosts: controllers:compute
  become: true
  gather_facts: false
  tags:
    - restart-openstack
  tasks:
    # The following services use RabbitMQ.
    - name: Restart OpenStack services
      ansible.builtin.shell:
        cmd: >-
          set -o pipefail &&
          systemctl list-units --type=service --all --no-legend --plain |
          egrep 'kolla-(barbican|blazar|cinder|cloudkitty|designate|heat|ironic|keystone|magnum|manila|neutron|nova|octavia)' |
          awk '{ print $1 }' |
          xargs -r systemctl restart
        executable: "/bin/bash"
