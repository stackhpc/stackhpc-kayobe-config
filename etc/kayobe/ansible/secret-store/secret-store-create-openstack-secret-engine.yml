---
- name: "Register OpenStack secert engine on overcloud {{ stackhpc_ca_secret_store }}"
  hosts: controllers
  vars:
    secret_store_bind_interface: "{{ internal_net_name | net_interface | replace('-', '_') }}"
    secret_store_bind_address: "{{ ansible_facts[secret_store_bind_interface].ipv4.address }}"
    secret_store_api_address: "https://{{ secret_store_bind_address }}:8200"
    secret_store_ca_cert: "{{ '/etc/pki/tls/certs/ca-bundle.crt' if os_distribution in ['centos', 'rocky'] else '/etc/ssl/certs/ca-certificates.crt' }}"
    openstack_secret_mountpoint: openstack
    secret_files:
      - src: "{{ kayobe_env_config_path + '/secrets.yml' }}"
        dest: "secrets"
      - src: "{{ kayobe_env_config_path + '/kolla/passwords.yml' }}"
        dest: "passwords"
  tasks:
    - name: Set a fact about the virtualenv on the remote system
      ansible.builtin.set_fact:
        virtualenv: "{{ ansible_python_interpreter | dirname | dirname }}"
      when:
        - ansible_python_interpreter is defined
        - not ansible_python_interpreter.startswith('/bin/')
        - not ansible_python_interpreter.startswith('/usr/bin/')

    - name: Ensure Python hvac module is installed
      ansible.builtin.pip:
        name: hvac
        state: latest
        extra_args: "{% if pip_upper_constraints_file %}-c {{ pip_upper_constraints_file }}{% endif %}"
        virtualenv: "{{ virtualenv is defined | ternary(virtualenv, omit) }}"
      become: "{{ virtualenv is not defined }}"

    - name: Include secret store keys
      ansible.builtin.include_vars:
        file: "{{ kayobe_env_config_path }}/{{ stackhpc_ca_secret_store }}/overcloud-{{ stackhpc_ca_secret_store }}-keys.json"
        name: secret_store_keys

    - name: Ensure 'openstack' secret engine exists
      run_once: true
      block:
        - name: Get existing secret engine mounts
          community.hashi_vault.vault_read:
            url: "{{ secret_store_api_address }}"
            auth_method: token
            token: "{{ secret_store_keys.root_token }}"
            ca_cert: "{{ secret_store_ca_cert }}"
            path: "sys/mounts"
          register: existing_mounts

        - name: Enable KV v2 secret engine at {{ openstack_secret_mountpoint }}
          community.hashi_vault.vault_write:
            url: "{{ secret_store_api_address }}"
            auth_method: token
            token: "{{ secret_store_keys.root_token }}"
            ca_cert: "{{ secret_store_ca_cert }}"
            path: "sys/mounts/{{ openstack_secret_mountpoint }}"
            data:
              type: "kv"
              description: "OpenStack secrets"
              options:
                version: "2"
          when: (openstack_secret_mountpoint + '/') not in existing_mounts.data.data

    - name: "Migrate secrets to {{ stackhpc_ca_secret_store }}"
      run_once: true
      no_log: true
      community.hashi_vault.vault_kv2_write:
        url: "{{ secret_store_api_address }}"
        auth_method: token
        token: "{{ secret_store_keys.root_token }}"
        ca_cert: "{{ secret_store_ca_cert }}"
        engine_mount_point: "{{ openstack_secret_mountpoint }}"
        path: "{{ item.dest }}"
        data: "{{ lookup('file', item.src) | from_yaml }}"
      loop: "{{ secret_files }}"

