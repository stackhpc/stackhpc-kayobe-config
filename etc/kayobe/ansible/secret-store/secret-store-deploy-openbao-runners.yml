---
- name: Deploy secret store on the runners
  any_errors_fatal: true
  gather_facts: true
  hosts: github-runners,gitlab-runners
  vars:
    secret_store_bind_interface: "{{ 'docker0' if inventory_hostname in groups['github-runners'] else 'lo' }}"
    secret_store_bind_address: "{{ ansible_facts[secret_store_bind_interface].ipv4.address }}"
    secret_store_api_address: "http://{{ secret_store_bind_address }}:8200"
  tasks:
    - name: Set a fact about the virtualenv on the remote system
      ansible.builtin.set_fact:
        virtualenv: "{{ ansible_python_interpreter | dirname | dirname }}"
      when:
        - ansible_python_interpreter is defined
        - not ansible_python_interpreter.startswith('/bin/')
        - not ansible_python_interpreter.startswith('/usr/bin/')

    - name: Ensure Python hvac module is installed
      ansible.builtin.pip:
        name: hvac
        state: latest
        extra_args: "{% if pip_upper_constraints_file %}-c {{ pip_upper_constraints_file }}{% endif %}"
        virtualenv: "{{ virtualenv is defined | ternary(virtualenv, omit) }}"
      become: "{{ virtualenv is not defined }}"

    - name: Ensure secret store directory exists in Kayobe configuration
      ansible.builtin.file:
        path: "{{ kayobe_env_config_path }}/openbao/"
        state: directory
      delegate_to: localhost
      run_once: true

    - name: Apply OpenBao role
      ansible.builtin.import_role:
        name: stackhpc.hashicorp.openbao
      vars:
        openbao_bind_addr: "{{ secret_store_bind_address }}"
        openbao_api_addr: "{{ secret_store_api_address }}"
        openbao_config_dir: "/opt/kayobe/openbao"
        openbao_cluster_name: "kayobe-automation"
        copy_self_signed_ca: false
        openbao_write_keys_file: true
        openbao_write_keys_file_path: "{{ kayobe_env_config_path }}/openbao/kayobe-automation-keys.json"

    - name: Include openbao keys
      ansible.builtin.include_vars:
        file: "{{ kayobe_env_config_path }}/openbao/kayobe-automation-keys.json"
        name: secret_store_keys
      tags: always

    - name: Unseal OpenBao
      ansible.builtin.import_role:
        name: stackhpc.hashicorp.vault_unseal
      vars:
        vault_api_addr: "{{ secret_store_api_address }}"
        vault_unseal_token: "{{ secret_store_keys.root_token }}"
        vault_unseal_keys: "{{ secret_store_keys.keys_base64 }}"
        vault_unseal_verify: false
      environment:
        https_proxy: ''

    - name: Create secret store
      ansible.legacy.hashivault_secret_engine:
        name: kayobe-automation
        backend: kv
        url: "{{ secret_store_api_address }}"
        token: "{{ secret_store_keys.root_token }}"

    - name: Ensure secret store is present
      community.hashi_vault.vault_write:
        url: "{{ secret_store_api_address }}"
        token: "{{ secret_store_keys.root_token }}"
        path: kayobe-automation/{{ kayobe_environment }}
        data:
          kayobe_vault_password: "{{ kolla_ansible_vault_password }}"
          kayobe_automation_ssh_private_key: "{{ lookup('ansible.builtin.file', '{{ ssh_private_key_path }}') }}"
          kayobe_tempest_openrc: "{{ lookup('ansible.builtin.file', '{{ kolla_config_path }}/public-openrc.sh') }}"
      tags: add_secrets
