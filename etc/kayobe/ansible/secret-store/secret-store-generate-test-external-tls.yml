---
- name: Generate external API certificate (for testing only)
  hosts: controllers
  run_once: true
  vars:
    secret_store_api_address: https://{{ internal_net_name | net_ip }}:8200
    # NOTE: Using the same CA as internal TLS.
    secret_store_intermediate_ca_name: OS-TLS-INT
  tasks:
    - name: Include secret store keys
      ansible.builtin.include_vars:
        file: "{{ kayobe_env_config_path }}/{{ stackhpc_ca_secret_store }}/overcloud-{{ stackhpc_ca_secret_store }}-keys.json"
        name: secret_store_keys

    - name: Issue a certificate for external TLS
      hashivault_pki_cert_issue:  # noqa: fqcn
        url: "{{ secret_store_api_address }}"
        ca_cert: "{{ '/etc/pki/tls/certs/ca-bundle.crt' if ansible_facts.os_family == 'RedHat' else '/usr/local/share/ca-certificates/OS-TLS-ROOT.crt' }}"
        token: "{{ secret_store_keys.root_token }}"
        mount_point: "{{ secret_store_intermediate_ca_name }}"
        role: "{{ overcloud_vault_pki_external_tls_role_name if stackhpc_ca_secret_store == 'vault' else overcloud_openbao_pki_external_tls_role_name }}"
        common_name: "{% if kolla_external_fqdn != kolla_external_vip_address %}{{ kolla_external_fqdn }}{% endif %}"
        extra_params:
          ip_sans: "{{ kolla_external_vip_address }}"
      register: external_cert
      environment:
        https_proxy: ""

    - name: Ensure certificates directory exists
      ansible.builtin.file:
        path: "{{ kayobe_env_config_path }}/kolla/certificates"
        state: directory
      delegate_to: localhost

    - name: Ensure CA certificates directory exists
      ansible.builtin.file:
        path: "{{ kayobe_env_config_path }}/kolla/certificates/ca"
        state: directory
      delegate_to: localhost

    - name: Copy external API PEM bundle
      no_log: true
      ansible.builtin.copy:
        dest: "{{ kayobe_env_config_path }}/kolla/certificates/haproxy.pem"
        content: |
          {{ external_cert.data.certificate }}
          {{ external_cert.data.issuing_ca }}
          {{ external_cert.data.private_key }}
        mode: "0600"
      delegate_to: localhost

    - name: Copy root CA
      ansible.builtin.copy:
        src: "{{ kayobe_env_config_path }}/{{ stackhpc_ca_secret_store }}/OS-TLS-ROOT.pem"
        dest: "{{ kayobe_env_config_path }}/kolla/certificates/ca/{{ stackhpc_ca_secret_store }}.crt"
        mode: "0600"
      delegate_to: localhost
