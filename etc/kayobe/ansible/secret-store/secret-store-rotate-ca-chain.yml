---
- name: Disable old CA chain on Seed
  any_errors_fatal: true
  gather_facts: true
  hosts: seed
  vars:
    secret_store_bind_interface: lo
    secret_store_bind_address: "{{ ansible_facts[secret_store_bind_interface].ipv4.address }}"
    secret_store_api_address: "http://{{ secret_store_bind_address }}:8200"
  tasks:
    - name: Set a fact about the virtualenv on the remote system
      ansible.builtin.set_fact:
        virtualenv: "{{ ansible_python_interpreter | dirname | dirname }}"
      when:
        - ansible_python_interpreter is defined
        - not ansible_python_interpreter.startswith('/bin/')
        - not ansible_python_interpreter.startswith('/usr/bin/')

    - name: Ensure Python PyYAML and hvac modules are installed
      ansible.builtin.pip:
        name:
          - PyYAML
          - hvac
        state: latest
        extra_args: "{% if pip_upper_constraints_file %}-c {{ pip_upper_constraints_file }}{% endif %}"
        virtualenv: "{{ virtualenv is defined | ternary(virtualenv, omit) }}"
      become: "{{ virtualenv is not defined }}"

    - name: Ensure secret store directory exists in Kayobe configuration
      ansible.builtin.file:
        path: "{{ kayobe_env_config_path }}/{{ stackhpc_ca_secret_store }}/"
        state: directory
      delegate_to: localhost
      run_once: true

    - name: Include {{ stackhpc_ca_secret_store }} keys
      ansible.builtin.include_vars:
        file: "{{ kayobe_env_config_path }}/{{ stackhpc_ca_secret_store }}/seed-{{ stackhpc_ca_secret_store }}-keys.json"
        name: secret_store_keys

    - name: Disable OS-TLS-ROOT and OS-TLS-INT secret (Seed)
      hashivault_secret_engine:  # noqa: fqcn
        url: "{{ secret_store_api_address }}"
        token: "{{ secret_store_keys.root_token }}"
        name: "{{ item }}"
        backend: pki
        state: disabled
      loop:
        - "OS-TLS-ROOT"
        - "OS-TLS-INT"

- name: Recreate CA chain on Seed
  ansible.builtin.import_playbook: secret-store-deploy-seed.yml
  vars:
    vault_pki_overwrite_certificates: true

- name: Disable intermediate CA on Overcloud
  any_errors_fatal: true
  gather_facts: true
  hosts: controllers
  vars:
    secret_store_bind_interface: "{{ internal_net_name | net_interface | replace('-', '_') }}"
    secret_store_bind_address: "{{ ansible_facts[secret_store_bind_interface].ipv4.address }}"
    secret_store_api_address: "https://{{ secret_store_bind_address }}:8200"
  tasks:
    - name: Set a fact about the virtualenv on the remote system
      ansible.builtin.set_fact:
        virtualenv: "{{ ansible_python_interpreter | dirname | dirname }}"
      when:
        - ansible_python_interpreter is defined
        - not ansible_python_interpreter.startswith('/bin/')
        - not ansible_python_interpreter.startswith('/usr/bin/')

    - name: Ensure Python hvac module is installed
      ansible.builtin.pip:
        name: hvac
        state: latest
        extra_args: "{% if pip_upper_constraints_file %}-c {{ pip_upper_constraints_file }}{% endif %}"
        virtualenv: "{{ virtualenv is defined | ternary(virtualenv, omit) }}"
      become: "{{ virtualenv is not defined }}"

    - name: Include secret store keys
      ansible.builtin.include_vars:
        file: "{{ kayobe_env_config_path }}/{{ stackhpc_ca_secret_store }}/overcloud-{{ stackhpc_ca_secret_store }}-keys.json"
        name: secret_store_keys

    - name: Disable OS-TLS-INT secret (Overcloud)
      hashivault_secret_engine:  # noqa: fqcn
        url: "{{ secret_store_api_address }}"
        token: "{{ secret_store_keys.root_token }}"
        ca_cert: "{{ '/etc/pki/tls/certs/ca-bundle.crt' if os_distribution == 'rocky' else '/etc/ssl/certs/ca-certificates.crt' }}"
        name: OS-TLS-INT
        backend: pki
        state: disabled
      run_once: true

- name: Recreate intermediate CA on Overcloud
  ansible.builtin.import_playbook: secret-store-deploy-overcloud.yml
