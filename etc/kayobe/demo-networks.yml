---
# Kayobe network configuration.

###############################################################################
# Network role to network mappings.

# Name of the network used for admin access to the overcloud
admin_oc_net_name: provision_oc_net

# Name of the network used by the seed to manage the bare metal overcloud
# hosts via their out-of-band management controllers.
oob_oc_net_name: oob_oc_net

# Name of the network used by the seed to provision the bare metal overcloud
# hosts.
#provision_oc_net_name:

# Name of the network used by the overcloud hosts to manage the bare metal
# compute hosts via their out-of-band management controllers.
#oob_wl_net_name:

# Name of the network used by the overcloud hosts to provision the bare metal
# workload hosts.
#provision_wl_net_name:

# Name of the network used to expose the internal OpenStack API endpoints.
internal_net_name: internal_net

# List of names of networks used to provide external network access via
# Neutron.
# Deprecated name: external_net_name
# If external_net_name is defined, external_net_names will default to a list
# containing one item, external_net_name.
external_net_names:
  - br_net

# Name of the network used to carry load balancing traffic.
octavia_net_name: octavia_net

# Name of the network used to expose the public OpenStack API endpoints.
public_net_name: external_net

# Name of the network used by Neutron to carry tenant overlay network traffic.
tunnel_net_name: internal_net

# Name of the network used to carry storage data traffic.
storage_net_name: storage_net

# Name of the network used to carry storage management traffic.
storage_mgmt_net_name: storage_mgmt_net

# Name of the network used to carry swift storage data traffic.
#swift_storage_net_name:

# Name of the network used to carry swift storage replication traffic.
#swift_storage_replication_net_name:

# Name of the network used to perform hardware introspection on the bare metal
# workload hosts.
#inspection_net_name:

# Name of the network used to perform cleaning on the bare metal workload
# hosts
#cleaning_net_name:

# Name of the network used to manage octavia loadbalancers
#octavia_net_name:

# Name of the network where Wazuh manager is exposed
#wazuh_dashboard_net_name:

###############################################################################
# Network definitions.

# Admin network IP information.
# admin_oc_net_cidr:
# admin_oc_net_allocation_pool_start:
# admin_oc_net_allocation_pool_end:
# admin_oc_net_gateway:
# admin_oc_net_vlan:
# admin_oc_net_mtu:
# admin_oc_net_routes:

# Load balancer network IP information
octavia_net_vlan: 159
octavia_net_cidr: 10.159.0.0/16
octavia_net_allocation_pool_start: 10.159.0.99
octavia_net_allocation_pool_end: 10.159.0.255
octavia_net_mtu: 1500
octavia_net_zone: "octavia"

# Overcloud out-of-band management network IP information.
oob_oc_net_cidr: 10.150.0.0/16
oob_oc_net_allocation_pool_start: 10.150.1.0
oob_oc_net_allocation_pool_end: 10.150.1.255
oob_oc_net_mtu: 1500
oob_oc_net_vlan: 150
oob_oc_libvirt_network_name: br-oob
oob_oc_net_zone: "oob_oc"

# Overcloud provisioning network IP information.
provision_oc_net_cidr: 10.151.0.0/16
provision_oc_net_allocation_pool_start: 10.151.1.0
provision_oc_net_allocation_pool_end: 10.151.1.254
provision_oc_net_inspection_allocation_pool_start: 10.151.2.0
provision_oc_net_inspection_allocation_pool_end: 10.151.2.255
# provision_oc_net_gateway: 10.151.254.254
provision_oc_net_mtu: 1500
provision_oc_net_vlan: 151
provision_oc_libvirt_network_name: br-provision
provision_oc_net_zone: "provision_oc"

bond_net_name: bond_net
bond_net_interface: "bond0"
bond_net_mtu: 9000
bond_net_bond_mode: "802.3ad"
bond_net_bond_xmit_hash_policy: "layer3+4"
bond_net_bond_miimon: "100"
bond_net_bond_updelay: "200"
bond_net_bond_downdelay: "200"
bond_net_bond_lacp_rate: "1"

# Internal network IP information.
internal_net_vip_address: 10.154.0.1
internal_net_cidr: 10.154.0.0/16
internal_net_allocation_pool_start: 10.154.0.100
internal_net_allocation_pool_end: 10.154.0.254
#internal_net_mtu: 9000
internal_net_vlan: 154
internal_net_zone: "trusted"

# External network IP information.
external_net_cidr: 192.168.0.0/24
external_net_mtu: 1500
external_net_vlan: 1000
external_net_zone: "external"

# Storage network IP information.
storage_net_cidr: 10.155.0.0/16
storage_net_allocation_pool_start: 10.155.0.100
storage_net_allocation_pool_end: 10.155.0.254
#storage_net_mtu: 9000
storage_net_vlan: 155
storage_net_zone: "trusted"

# Storage management network IP information.
storage_mgmt_net_cidr: 10.156.0.0/16
storage_mgmt_net_allocation_pool_start: 10.156.0.100
storage_mgmt_net_allocation_pool_end: 10.156.0.254
#storage_mgmt_net_mtu: 9000
storage_mgmt_net_vlan: 156
storage_mgmt_net_zone: "storage_mgmt"

###############################################################################
# Network virtual patch link configuration.

# Suffix for Open vSwitch bridge names.
#network_bridge_suffix_ovs:

# Prefix for virtual patch interface names.
#network_patch_prefix:

# Suffix for virtual patch link interface names when connected towards the
# physical interface.
#network_patch_suffix_phy:

# Suffix for virtual patch link interface names when connected towards the
# OVS bridge.
#network_patch_suffix_ovs:

###############################################################################
# Network routing table configuration.

# List of IP routing tables. Each item should be a dict containing 'id' and
# 'name' items. These tables will be added to /etc/iproute2/rt_tables.
#network_route_tables:

###############################################################################
# Network connectivity check configuration.

# External IP address to check. Default is 8.8.8.8.
#nc_external_ip:

# External hostname to check. Default is google.com.
#nc_external_hostname:

###############################################################################
# Dummy variable to allow Ansible to accept this file.
workaround_ansible_issue_8743: yes
