---
# Most development environments will use nested virtualisation, and we can't
# guarantee that nested KVM support is available. Use QEMU as a lowest common
# denominator.
nova_compute_virt_type: qemu

# Reduce the control plane's memory footprint by limiting the number of worker
# processes to one per-service.
openstack_service_workers: "1"
openstack_service_rpc_workers: "1"

# OpenSearch memory tuning
opensearch_heap_size: 200m

# Increase Grafana timeout
grafana_start_first_node_retries: 20

# Open up ports in firewalld for services on the public API network.
enable_external_api_firewalld: "{{ controller_firewalld_enabled | bool }}"

# Host interface on the Octavia management network.
octavia_network_interface: "{{ octavia_net_name | net_interface(groups['controllers'][0]) }}"

# Management network registered by octavia_auto_configure.
octavia_amp_network:
  name: lb-mgmt-net
  provider_network_type: vlan
  provider_segmentation_id: "{{ lb_mgmt_vlan }}"
  provider_physical_network: physnet1
  external: false
  shared: false
  subnet:
    name: lb-mgmt-subnet
    cidr: "{{ lb_mgmt_cidr }}"
    allocation_pool_start: "{{ lb_mgmt_neutron_allocation_pool_start }}"
    allocation_pool_end: "{{ lb_mgmt_neutron_allocation_pool_end }}"
    no_gateway_ip: true
    enable_dhcp: true
