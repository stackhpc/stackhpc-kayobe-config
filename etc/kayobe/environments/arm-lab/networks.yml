---
admin_oc_net_name: aio
oob_oc_net_name: aio
provision_oc_net_name: aio
oob_wl_net_name: aio
provision_wl_net_name: aio
internal_net_name: aio

external_net_names:
  - aio

public_net_name: aio
tunnel_net_name: aio
storage_net_name: aio
storage_mgmt_net_name: aio
swift_storage_net_name: aio
swift_storage_replication_net_name: aio
inspection_net_name: aio
cleaning_net_name: aio

ethernet_bootproto: dhcp
ethernet_zone: trusted

# All-in-one network.
aio_cidr: 172.16.0.0/23
# aio_allocation_pool_start: 192.168.33.3
# aio_allocation_pool_end: 192.168.33.30
# aio_neutron_allocation_pool_start: 192.168.33.31
# aio_neutron_allocation_pool_end: 192.168.33.127
aio_inspection_allocation_pool_start: 172.16.1.201
aio_inspection_allocation_pool_end: 172.16.1.210
aio_vip_address: 172.16.1.222
aio_zone: aio
aio_gateway: 172.16.0.1

###############################################################################
# Network connectivity checks.
nc_external_ip: "{{ nc_external_ip_custom | default('8.8.8.8') }}"
nc_external_hostname: "{{ nc_external_hostname_custom | default('google.com') }}"
