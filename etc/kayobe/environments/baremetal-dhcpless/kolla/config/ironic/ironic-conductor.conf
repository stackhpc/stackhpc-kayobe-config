[DEFAULT]
grub_config_path = {{ ironic_dhcpless_grub_config_path }}

{% if ironic_dhcpless_bootloader %}
[conductor]
bootloader = {{ ironic_dhcpless_bootloader }}
{% endif %}

{% if ironic_dhcpless_external_http_url or ironic_dhcpless_external_callback_url %}
[deploy]
{% if ironic_dhcpless_external_http_url %}
external_http_url = {{ ironic_dhcpless_external_http_url }}
{% endif %}
{% if ironic_dhcpless_external_callback_url %}
external_callback_url = {{ ironic_dhcpless_external_callback_url }}
{% endif %}
{% endif %}

[inspector]
# Pass Kayobe's IPA inspection options (LLDP, collectors, benchmarks) to
# ramdisks booted by Ironic for in-band inspection. These are otherwise only
# used for PXE-booted inspection.
extra_kernel_params = {{ inspector_extra_kernel_options | join(' ') }}
# Virtual media boots have no BOOTIF, so inspection data has no PXE interface.
# Without this, in-band inspection would mark every port as not PXE-enabled,
# and cleaning and provisioning would fail with "No available PXE-enabled
# ports".
update_pxe_enabled = False
