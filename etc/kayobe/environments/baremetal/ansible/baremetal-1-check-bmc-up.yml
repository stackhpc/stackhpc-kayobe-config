---
- name: Install OpenStack client
  ansible.builtin.import_playbook: install-openstack-cli.yml

- name: Ensure baremetal node BMCs are reachable
  hosts: baremetal-redfish
  gather_facts: false
  max_fail_percentage: >-
    {{ baremetal_compute_register_max_fail_percentage |
       default(baremetal_compute_max_fail_percentage) |
       default(kayobe_max_fail_percentage) |
       default(100) }}
  tags:
    - baremetal
  vars:
    venv: "{{ virtualenv_path }}/openstack-cli"
    controller_host: "{{ groups['controllers'][0] }}"

  tasks:
    - name: Check Ironic variables are defined
      ansible.builtin.assert:
        that:
          - ironic_driver | default('', true) | length > 0
          - ironic_address | default('', true) | length > 0
          - ironic_username | default('', true) | length > 0
          - ironic_password | default('', true) | length > 0
          - ironic_properties | default({}, true) | length > 0
          - ironic_resource_class | default('', true) | length > 0
        fail_msg: One or more Ironic variables are undefined.

    - name: Show and check baremetal node
      delegate_to: "{{ controller_host }}"
      vars:
        # NOTE: Without this, the controller's ansible_host variable will not
        # be respected when using delegate_to.
        ansible_host: "{{ hostvars[controller_host].ansible_host | default(controller_host) }}"
      environment: "{{ openstack_auth_env }}"
      block:

        - name: Show baremetal node
          ansible.builtin.import_tasks: tasks/show-node.yml

        - name: Check if bmc is up
          ansible.builtin.set_fact:
            kayobe_bmc_up: "{{ (node_show.stdout | from_json)['extra'].get('kayobe_bmc_up') }}"
            provision_state: "{{ (node_show.stdout | from_json)['provision_state'] }}"
            power_state: "{{ (node_show.stdout | from_json)['power_state'] }}"
            kayobe_released: "{{ (node_show.stdout | from_json)['extra'].get('kayobe_released') }}"
            resource_class: "{{ (node_show.stdout | from_json)['resource_class'] }}"

        - name: Set enrolment resource class
          ansible.builtin.command:
            cmd: >-
              {{ venv }}/bin/openstack baremetal node set {{ inventory_hostname }}
              --resource-class {{ ironic_resource_class }}_enroll
          changed_when: true
          when:
            - kayobe_released is falsy
            - provision_state in ["enroll", "manageable"]
            - resource_class != ironic_resource_class ~ '_enroll'

        - name: Output when bmc last up run
          ansible.builtin.debug:
            msg: "BMC for node {{ inventory_hostname }} was up at {{ kayobe_bmc_up }}."
          when: kayobe_bmc_up is truthy

        - name: Check BMC is up
          ansible.builtin.import_tasks: tasks/check-bmc.yml
          vars:
            bmc_check_retries: 5
            bmc_check_delay: 2

        # #TODO(ClaudiaWatson): add an optional BMC reboot into the flow
        # - name: Reboot BMC
        #   community.general.redfish_command:
        #     category: Manager
        #     command: PowerReboot
        #     username: "{{ ironic_username }}"
        #     password: "{{ ironic_password }}"
        #   when:
        #     - kayobe_bmc_up == ""
        #     - ironic_username is defined

        - name: Note when we are able to reach the bmc, the first time
          ansible.builtin.command:
            cmd: |
              {{ venv }}/bin/openstack baremetal node set {{ inventory_hostname }} --extra kayobe_bmc_up={{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}
          register: node_set
          failed_when:
            - node_set.rc != 0
          changed_when: true
          when: kayobe_bmc_up is falsy

        - name: Power node off
          ansible.builtin.command:
            cmd: |
              {{ venv }}/bin/openstack baremetal node power off {{ inventory_hostname }}
          register: node_set
          failed_when:
            - node_set.rc != 0
          changed_when: true
          when:
            - provision_state in ["enroll", "manageable"]
            - power_state == "power on"

        - name: Try move from enroll to manageable
          ansible.builtin.command:
            cmd: |
              {{ venv }}/bin/openstack baremetal node manage {{ inventory_hostname }} --wait 300
          register: node_set
          failed_when:
            - node_set.rc != 0
          changed_when: true
          when:
            - provision_state == "enroll"
