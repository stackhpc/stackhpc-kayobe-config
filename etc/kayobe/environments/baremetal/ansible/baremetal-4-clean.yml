---
- name: Install OpenStack client
  ansible.builtin.import_playbook: install-openstack-cli.yml

- name: Ensure baremetal nodes are cleaned and available
  hosts: baremetal-redfish
  gather_facts: false
  max_fail_percentage: >-
    {{ baremetal_compute_register_max_fail_percentage |
       default(baremetal_compute_max_fail_percentage) |
       default(kayobe_max_fail_percentage) |
       default(100) }}
  tags:
    - baremetal
  vars:
    venv: "{{ virtualenv_path }}/openstack-cli"
    controller_host: "{{ groups['controllers'][0] }}"
    cleaning_timeout: "{{ 60 * 30 }}"  # 30 minutes

  tasks:
    - name: Show and check baremetal node
      delegate_to: "{{ controller_host }}"
      vars:
      # NOTE: Without this, the controller's ansible_host variable will not
      # be respected when using delegate_to.
        ansible_host: "{{ hostvars[controller_host].ansible_host | default(controller_host) }}"
      environment: "{{ openstack_auth_env }}"
      block:

        - name: Show baremetal node
          ansible.builtin.import_tasks: tasks/show-node.yml

        - name: Check BMC is up
          ansible.builtin.import_tasks: tasks/check-bmc.yml

        - name: Check for agent inspection details
          ansible.builtin.set_fact:
            kayobe_agent_inspect_done: "{{ (node_show.stdout | from_json)['extra'].get('kayobe_agent_inspect_done') }}"
            kayobe_clean_done: "{{ (node_show.stdout | from_json)['extra'].get('kayobe_clean_done') }}"
            network_interface: "{{ (node_show.stdout | from_json)['network_interface'] }}"
            provision_state: "{{ (node_show.stdout | from_json)['provision_state'] }}"
            node_maintenance: "{{ (node_show.stdout | from_json)['maintenance'] }}"

        - name: Fail if not agent inspection done
          ansible.builtin.fail:
            msg: "{{ inventory_hostname }} has not been inspected"
          when:
            - kayobe_agent_inspect_done is falsy

        - name: Fail if not in manageable or clean failed state
          ansible.builtin.fail:
            msg: "{{ inventory_hostname }} has the wrong provision_state: {{ provision_state }}"
          when:
            - provision_state not in ["manageable", "clean failed"]
            - kayobe_clean_done is falsy

        - name: If in clean failed, move back to managable
          ansible.builtin.command:
            cmd: |
              {{ venv }}/bin/openstack baremetal node manage {{ inventory_hostname }} --wait 300
          register: node_manage
          failed_when:
            - node_manage.rc != 0
          when:
            - provision_state == "clean failed"

        - name: Remove node from maintenance
          ansible.builtin.command:
            cmd: |
              {{ venv }}/bin/openstack baremetal node maintenance unset {{ inventory_hostname }}
          register: node_set
          failed_when:
            - node_set.rc != 0
          when:
            - node_maintenance
            - provision_state in ["manageable", "clean failed"]

        - name: Ensure hosts set to use RAID
          ansible.builtin.shell: |
            {{ venv }}/bin/openstack baremetal node set \
            --target-raid-config {{ (ironic_target_raid_config if ironic_target_raid_config is string else ironic_target_raid_config | to_json) | quote }} \
            --raid-interface agent {{ inventory_hostname }}
          when:
            - kayobe_clean_done is falsy
            - ironic_target_raid_config is defined

        - name: Move to neutron interface, assuming its a multi-tenant node
          ansible.builtin.command:
            cmd: |
              {{ venv }}/bin/openstack baremetal node set {{ inventory_hostname }} --network-interface neutron --driver-info inspection_network={{ kolla_ironic_inspection_network }} --driver-info cleaning_network={{ kolla_ironic_cleaning_network }} --driver-info provision_network={{ kolla_ironic_provisioning_network }}
          register: node_set
          failed_when:
            - node_set.rc != 0
          changed_when: true
          when:
            - kayobe_clean_done is falsy
            - ironic_network_interface == "neutron"

        - name: Move to flat interface, if required
          ansible.builtin.command:
            cmd: |
              {{ venv }}/bin/openstack baremetal node set {{ inventory_hostname }} --network-interface flat --driver-info inspection_network={{ kolla_ironic_inspection_network }} --driver-info cleaning_network={{ kolla_ironic_cleaning_network }} --driver-info provision_network={{ kolla_ironic_provisioning_network }}
          register: node_set
          failed_when:
            - node_set.rc != 0
          changed_when: true
          when:
            - kayobe_clean_done is falsy
            - ironic_network_interface == "flat"

        - name: Start cleaning
          ansible.builtin.command:
            cmd: |
              {{ venv }}/bin/openstack baremetal node provide {{ inventory_hostname }} --wait {{ cleaning_timeout }}
          async: "{{ cleaning_timeout * 2 }}"
          poll: 0
          register: clean_sleeper
          when: kayobe_clean_done is falsy or provision_state in ["clean failed"]

        - name: Wait for cleaning
          ansible.builtin.async_status:
            jid: "{{ clean_sleeper.ansible_job_id }}"
          register: node_set
          until: node_set is finished
          retries: "{{ 2 * cleaning_timeout / 10 }}"
          poll: 10
          failed_when:
            - node_set.rc != 0
          changed_when: true
          when: kayobe_clean_done is falsy or provision_state in ["clean failed"]

        - name: Note when cleaning has completed
          ansible.builtin.command:
            cmd: |
              {{ venv }}/bin/openstack baremetal node set {{ inventory_hostname }} --extra kayobe_clean_done={{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}
          register: node_set
          failed_when:
            - node_set.rc != 0
          changed_when: true
          when: kayobe_clean_done is falsy
