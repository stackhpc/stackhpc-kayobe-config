---
- name: Install OpenStack client
  ansible.builtin.import_playbook: install-openstack-cli.yml

- name: Ensure cleaned baremetal nodes are released for scheduling
  hosts: baremetal-redfish
  gather_facts: false
  max_fail_percentage: >-
    {{ baremetal_compute_register_max_fail_percentage |
       default(baremetal_compute_max_fail_percentage) |
       default(kayobe_max_fail_percentage) |
       default(100) }}
  tags:
    - baremetal
  vars:
    venv: "{{ virtualenv_path }}/openstack-cli"
    controller_host: "{{ groups['controllers'][0] }}"

  tasks:
    - name: Release baremetal node
      delegate_to: "{{ controller_host }}"
      vars:
        # NOTE: Respect the controller's ansible_host when delegating.
        ansible_host: "{{ hostvars[controller_host].ansible_host | default(controller_host) }}"
      environment: "{{ openstack_auth_env }}"
      block:
        - name: Show baremetal node
          ansible.builtin.import_tasks: tasks/show-node.yml

        - name: Check release details
          ansible.builtin.set_fact:
            kayobe_clean_done: "{{ (node_show.stdout | from_json)['extra'].get('kayobe_clean_done') }}"
            kayobe_released: "{{ (node_show.stdout | from_json)['extra'].get('kayobe_released') }}"
            resource_class: "{{ (node_show.stdout | from_json)['resource_class'] }}"
            maintenance: "{{ (node_show.stdout | from_json)['maintenance'] }}"
            provision_state: "{{ (node_show.stdout | from_json)['provision_state'] }}"

        - name: Set resource class
          when:
            - kayobe_clean_done is truthy
            - kayobe_released is falsy
            - resource_class != ironic_resource_class
            # Ironic rejects resource class changes on deployed nodes.
            - provision_state not in ["active", "deploying", "wait call-back", "rescue", "rescuing"]
          block:
            # Ironic may require maintenance to change the resource class.
            - name: Put node into maintenance mode
              ansible.builtin.command: "{{ venv }}/bin/openstack baremetal node maintenance set {{ inventory_hostname }}"
              register: node_maint_set
              changed_when: true
              when: maintenance is falsy

            - name: Set resource class
              ansible.builtin.command: >-
                {{ venv }}/bin/openstack baremetal node set {{ inventory_hostname }}
                --resource-class {{ ironic_resource_class }}
              changed_when: true

          always:
            - name: Bring node out of maintenance mode
              ansible.builtin.command: "{{ venv }}/bin/openstack baremetal node maintenance unset {{ inventory_hostname }}"
              changed_when: true
              when: node_maint_set is changed

        - name: Note when node was released
          ansible.builtin.command: >-
            {{ venv }}/bin/openstack baremetal node set {{ inventory_hostname }}
            --extra kayobe_released={{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}
          changed_when: true
          when:
            - kayobe_clean_done is truthy
            - kayobe_released is falsy
