---
- name: Install OpenStack client
  ansible.builtin.import_playbook: install-openstack-cli.yml

- name: Clear previous inspection state of baremetal nodes
  hosts: baremetal-redfish
  gather_facts: false
  max_fail_percentage: >-
    {{ baremetal_compute_register_max_fail_percentage |
       default(baremetal_compute_max_fail_percentage) |
       default(kayobe_max_fail_percentage) |
       default(100) }}
  tags:
    - baremetal
  vars:
    venv: "{{ virtualenv_path }}/openstack-cli"
    controller_host: "{{ groups['controllers'][0] }}"

  tasks:
    - name: Show and check baremetal node
      delegate_to: "{{ controller_host }}"
      vars:
        # NOTE: Respect the controller's ansible_host when delegating.
        ansible_host: "{{ hostvars[controller_host].ansible_host | default(controller_host) }}"
      environment: "{{ openstack_auth_env }}"
      block:

        - name: Show baremetal node
          ansible.builtin.import_tasks: tasks/show-node.yml

        - name: Check BMC is up
          ansible.builtin.import_tasks: tasks/check-bmc.yml

        - name: Check for inspection details
          ansible.builtin.set_fact:
            kayobe_agent_inspect_done: "{{ (node_show.stdout | from_json)['extra'].get('kayobe_agent_inspect_done') }}"
            kayobe_redfish_inspect_done: "{{ (node_show.stdout | from_json)['extra'].get('kayobe_redfish_inspect_done') }}"

        - name: Note unset previous agent inspection flag
          ansible.builtin.command:
            cmd: |
              {{ venv }}/bin/openstack baremetal node unset {{ inventory_hostname }} --extra kayobe_agent_inspect_done
          register: node_set_a
          failed_when:
            - node_set_a.rc != 0
          changed_when: true
          when: kayobe_agent_inspect_done is truthy

        - name: Note unset previous redfish inspection flag
          ansible.builtin.command:
            cmd: |
              {{ venv }}/bin/openstack baremetal node unset {{ inventory_hostname }} --extra kayobe_redfish_inspect_done
          register: node_set_r
          failed_when:
            - node_set_r.rc != 0
          changed_when: true
          when: kayobe_redfish_inspect_done is truthy

