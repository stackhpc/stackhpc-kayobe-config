---
- name: Install OpenStack client
  ansible.builtin.import_playbook: install-openstack-cli.yml

- name: Ensure PXE is enabled on all baremetal ports
  hosts: baremetal-compute
  gather_facts: false
  max_fail_percentage: >-
    {{ baremetal_compute_register_max_fail_percentage |
       default(baremetal_compute_max_fail_percentage) |
       default(kayobe_max_fail_percentage) |
       default(100) }}
  tags:
    - baremetal
  vars:
    venv: "{{ virtualenv_path }}/openstack-cli"
    controller_host: "{{ groups['controllers'][0] }}"

  tasks:
    - name: Show and check baremetal node
      delegate_to: "{{ controller_host }}"
      vars:
        # NOTE: Respect the controller's ansible_host when delegating.
        ansible_host: "{{ hostvars[controller_host].ansible_host | default(controller_host) }}"
      environment: "{{ openstack_auth_env }}"
      block:
        - name: Retrieve baremetal port UUIDs for baremetal node
          ansible.builtin.command:
            cmd: "{{ venv }}/bin/openstack baremetal port list --fields uuid -f value --node {{ inventory_hostname }}"
          register: port_uuids

        - name: Update baremetal port to pxe enable
          ansible.builtin.command:
            cmd: "{{ venv }}/bin/openstack baremetal port set --pxe-enabled {{ item }}"
          loop: "{{ port_uuids.stdout | split('\n') }}"
