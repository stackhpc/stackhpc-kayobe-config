---
- name: Install OpenStack client
  ansible.builtin.import_playbook: install-openstack-cli.yml

- name: Provision overcloud hosts on baremetal nodes
  hosts: baremetal-overcloud
  gather_facts: false
  vars:
    project_environment: >-
      {{ openstack_auth_env | combine({
           'OS_PROJECT_NAME': ironic_provision_project,
           'OS_SYSTEM_SCOPE': ''}) }}
    force_server_delete: false
    create_flavor: false
    controller_host: "{{ groups['controllers'][0] }}"
    venv: "{{ virtualenv_path }}/openstack-cli"
  tasks:
    - name: Show and check baremetal node
      delegate_to: "{{ controller_host }}"
      vars:
        # NOTE: Without this, the controller's ansible_host variable will not
        # be respected when using delegate_to.
        ansible_host: "{{ hostvars[controller_host].ansible_host | default(controller_host) }}"
        ansible_python_interpreter: "{{ venv }}/bin/python"
      environment: "{{ openstack_auth_env }}"
      block:
        - name: Fail if required variables are not set
          ansible.builtin.fail:
            msg: "{{ item }} must be set"
          loop:
            - ironic_provision_network
            - ironic_provision_flavor
            - ironic_provision_image
            - ironic_provision_key_name
            - ironic_provision_project
          when: vars[item] | default('', true) == ''

        - name: Gather information about baremetal nodes
          openstack.cloud.baremetal_node_info:
            name: "{{ inventory_hostname }}"
          environment: "{{ openstack_auth_env_system_scope }}"
          register: bmnode_raw

        - name: Fail if baremetal node is not registered in Ironic
          ansible.builtin.fail:
            msg: "{{ inventory_hostname }} is not registered in Ironic."
          when: bmnode_raw.nodes | length == 0

        - name: Set fact for baremetal node information
          ansible.builtin.set_fact:
            bmnode: "{{ bmnode_raw.nodes | first }}"

        - name: Check if first provision done
          ansible.builtin.set_fact:
            kayobe_released: "{{ bmnode.extra.get('kayobe_released') }}"
            kayobe_first_provision_done: "{{ bmnode.extra.get('kayobe_first_provision') }}"

        - name: Fail if baremetal node has not been released
          ansible.builtin.fail:
            msg: "{{ inventory_hostname }} has not been released by baremetal-5-release.yml yet."
          when:
            - not force_server_delete | bool
            - kayobe_released is falsy
            - bmnode.provision_state != "active"

        - name: Fail if not in available or active
          ansible.builtin.fail:
            msg: "{{ inventory_hostname }} has the wrong provision_state: {{ bmnode.provision_state }}"
          when:
            - not force_server_delete | bool
            - bmnode.provision_state not in ["active", "available"]

        - name: Ensure server and port are absent
          when: force_server_delete | bool
          block:
            - name: Ensure server is absent
              openstack.cloud.server:
                state: absent
                name: "{{ ironic_provision_server_name }}"
                timeout: 1800
              environment: "{{ project_environment }}"

            - name: Ensure port is absent
              openstack.cloud.port:
                state: absent
                name: "{{ ironic_provision_server_name }}"
                network: "{{ ironic_provision_network }}"
              environment: "{{ project_environment }}"

        - name: Ensure server is present
          when: not force_server_delete | bool
          block:
            - name: Create flavor for baremetal
              openstack.cloud.compute_flavor:
                state: present
                is_public: false
                name: "{{ ironic_provision_flavor }}"
                ram: "{{ ironic_provision_flavor_ram }}"
                vcpus: "{{ ironic_provision_flavor_vcpus }}"
                disk: "{{ ironic_provision_flavor_disk }}"
                extra_specs: "{{ {
                  ('resources:CUSTOM_' ~ ironic_resource_class | upper ): 1,
                  'resources:VCPU': 0,
                  'resources:DISK_GB': 0,
                  'resources:MEMORY_MB': 0
                } }}"
              run_once: true
              when: create_flavor | bool

            - name: Ensure provisioning project has access to flavor
              openstack.cloud.compute_flavor_access:
                state: present
                name: "{{ ironic_provision_flavor }}"
                project: "{{ ironic_provision_project }}"
              run_once: true
              when: create_flavor | bool

            - name: Create key pair for baremetal
              openstack.cloud.keypair:
                state: present
                name: "{{ ironic_provision_key_name }}"
                public_key: "{{ lookup('file', ssh_public_key_path) }}"
              environment: "{{ project_environment }}"

            - name: Create port
              openstack.cloud.port:
                state: present
                name: "{{ ironic_provision_server_name }}"
                network: "{{ ironic_provision_network }}"
                fixed_ips: "{{ ironic_provision_fixed_ips | default(omit) }}"
                vnic_type: baremetal
              environment: "{{ project_environment }}"
              register: bmport

            - name: Set unlimited core quota for project
              openstack.cloud.quota:
                name: "{{ ironic_provision_project }}"
                cores: -1
              run_once: true

            # TODO: we should wait till we can reach ssh, via jump host
            - name: Deploy Server
              openstack.cloud.server:
                state: present
                name: "{{ ironic_provision_server_name }}"
                nics:
                  - port-id: "{{ bmport.port.id }}"
                image: "{{ ironic_provision_image }}"
                flavor: "{{ ironic_provision_flavor }}"
                key_name: "{{ ironic_provision_key_name }}"
                availability_zone: "::{{ bmnode.id }}"
                timeout: 1800  # wait 30 mins for build
                config_drive: yes
              environment: "{{ project_environment }}"
              register: server

            - name: Note when provision has first worked
              ansible.builtin.command:
                cmd: >-
                  {{ venv }}/bin/openstack baremetal node set {{ inventory_hostname }}
                  --extra kayobe_first_provision={{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}
              register: node_set
              failed_when:
                - node_set.rc != 0
              changed_when: true
              when: kayobe_first_provision_done is falsy
