---
- name: Install OpenStack client
  ansible.builtin.import_playbook: install-openstack-cli.yml

- name: Ensure baremetal nodes are removed from ironic
  hosts: baremetal-compute
  gather_facts: false
  max_fail_percentage: >-
    {{ baremetal_compute_register_max_fail_percentage |
       default(baremetal_compute_max_fail_percentage) |
       default(kayobe_max_fail_percentage) |
       default(100) }}
  tags:
    - baremetal
  vars:
    venv: "{{ virtualenv_path }}/openstack-cli"
    controller_host: "{{ groups['controllers'][0] }}"
  tasks:
    - block:
        - name: Show baremetal node
          ansible.builtin.command:
            cmd: "{{ venv }}/bin/openstack baremetal node show -f json {{ inventory_hostname }}"
          register: node_show
          failed_when:
            - '"HTTP 404" not in node_show.stderr'
            - node_show.rc != 0
          changed_when: false

        - name: Delete baremetal nodes
          ansible.builtin.command:
            cmd: "{{ venv }}/bin/openstack baremetal node delete {{ inventory_hostname }}"
          when:
            - node_show.rc == 0
            - (node_show.stdout | from_json)['provision_state'] in ["enroll", "manageable"]
      delegate_to: "{{ controller_host }}"
      vars:
        # NOTE: Respect the controller's ansible_host when delegating.
        ansible_host: "{{ hostvars[controller_host].ansible_host | default(controller_host) }}"
      environment: "{{ openstack_auth_env }}"
