---
ironic_provision_server_name: "{{ inventory_hostname }}"
ironic_provision_network: "provision-net"
ironic_provision_flavor:
# Example flavor sizes; scheduling only uses the resource class.
ironic_provision_flavor_ram: 262144
ironic_provision_flavor_vcpus: 64
ironic_provision_flavor_disk: 480
ironic_provision_image: "overcloud-{{ os_distribution }}-{{ os_release }}-{{ stackhpc_overcloud_host_image_version }}"
ironic_provision_key_name: "stack"
ironic_provision_project: "admin"
# e.g. [{ip_address: 10.0.0.10}]
#ironic_provision_fixed_ips:
