{% raw %}
{% set internal_ip = (internal_net_ips).get(inventory_hostname) %}
# NOTE(hollie): remember to document oob_net as a defined network... rather than relying on seperate out-of-band networks.
{% set oob_ip = (oob_net_ips).get(inventory_hostname) %}
{% if internal_ip %}
Listen {{ internal_ip }}:8089
{% endif %}
{% if oob_ip %}
Listen {{ oob_ip }}:8089
{% endif %}

TraceEnable off

<VirtualHost *:{{ ironic_http_port }}>
    LogLevel warn
    ErrorLog "/var/log/kolla/ironic/ironic-http-error.log"
    LogFormat "%h %l %u %t \"%r\" %>s %b %D \"%{Referer}i\" \"%{User-Agent}i\"" logformat
    CustomLog "/var/log/kolla/ironic/ironic-http-access.log" logformat
    DocumentRoot "/var/lib/ironic/httpboot"
    <Directory /var/lib/ironic/httpboot>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
{% endraw %}
