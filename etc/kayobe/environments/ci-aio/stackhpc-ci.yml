---
###############################################################################
# Kolla configuration.

# Docker namespace to use for Kolla images. Default is 'kolla'.
kolla_docker_namespace: stackhpc-dev

###############################################################################
# StackHPC configuration.

# AIOs currently run on SMS, and pull packages and containers through an
# authenticating caching proxy.
# Host and port of a package repository mirror.
stackhpc_aio_proxy_address: "192.168.46.157"
stackhpc_repo_mirror_url: "http://{{ stackhpc_aio_proxy_address }}:80"
# Credentials are not required in CI, proxy handles authentication
stackhpc_repo_mirror_username: "{{ none }}"
stackhpc_repo_mirror_password: "{{ none }}"
# Host and port of container registry.
stackhpc_docker_registry: "{{ stackhpc_aio_proxy_address }}:5000"
# Credentials are not required in CI, proxy handles authentication
stackhpc_docker_registry_username: "{{ none }}"
stackhpc_docker_registry_password: "{{ none }}"
docker_registry_insecure: true

# Override Pulp credentials to allow querying container image tags in the
# check-tags.yml custom playbook.
pulp_url: "{{ stackhpc_release_pulp_url }}"
pulp_username: "skc-ci-aio-gazpacho"
pulp_password: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  32323664386164316338336536346562643432353961613837383430313063396639383033336163
  3638336163626137303766336233663133363530616234360a303563323762393465653462386665
  38306630386239616636343565363834666266636231316666326239613864653961356635333966
  3838306238363834640a383833373364653733623236616334353330626161363039623738373063
  39393239383639313933343234646562373330653232613062323563373134326633

# The aio environment reads these from files in the deploying user's home
# directory, which do not exist in CI.
stackhpc_release_pulp_username: "{{ pulp_username }}"
stackhpc_release_pulp_password: "{{ pulp_password }}"
