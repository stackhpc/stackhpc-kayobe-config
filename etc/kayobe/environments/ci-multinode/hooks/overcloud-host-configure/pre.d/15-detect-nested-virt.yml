---
# Runs before Kayobe configures the hosts, so that the result is in place for
# controller_extra_network_interfaces and the Kolla configuration.
- name: Detect whether the compute hosts support nested virtualisation
  hosts: compute
  gather_facts: true
  vars:
    ansible_user: "{{ bootstrap_user }}"
    # We can't assume that a virtualenv exists at this point
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: -o StrictHostKeyChecking=no
  tasks:
    - name: Determine whether this host exposes hardware virtualisation
      ansible.builtin.set_fact:
        nested_virt_available: >-
          {{ ['vmx', 'svm'] | intersect(ansible_facts.flags | default([])) | length > 0 }}

    - name: Record whether the Octavia amphora driver can be used
      vars:
        # Every compute must support it
        all_computes_support_nested_virt: >-
          {{ ansible_play_hosts | map('extract', hostvars, 'nested_virt_available') | select | list | length == ansible_play_hosts | length }}
      ansible.builtin.copy:
        content: |
          ---
          # This is generated by hooks/overcloud-host-configure/pre.d/15-detect-nested-virt.yml
          # This overrides the default set in globals.yml
          octavia_amphora_driver_enabled: {{ all_computes_support_nested_virt }}
        dest: "{{ kayobe_env_config_path }}/zz-nested-virt.yml"
        mode: "0644"
      delegate_to: localhost
      run_once: true
