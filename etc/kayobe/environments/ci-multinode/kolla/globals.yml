# yamllint disable-file
---
############################################################################
# TLS

# Internal TLS configuration
# Copy the self-signed CA into the kolla containers
kolla_copy_ca_into_containers: "yes"
# Use the following trust store within the container
openstack_cacert: "{{ '/etc/pki/tls/certs/ca-bundle.crt' if os_distribution == 'rocky' else '/etc/ssl/certs/ca-certificates.crt' }}"

# Enable backend TLS
kolla_enable_tls_backend: "yes"

# Enable RabbitMQ TLS
rabbitmq_enable_tls: "yes"

############################################################################
# Most development environments will use nested virtualisation, and we can't
# guarantee that nested KVM support is available, so QEMU is the lowest common
# denominator. However, amphorae are unusable under emulation in terms of time
# during tempest testing and Octavia times out waiting for them to spin up
# we require KVM when the amphora driver is in use
nova_compute_virt_type: "{{ 'qemu' if kolla_enable_ovn | bool else 'kvm' }}"

# Reduce the control plane's memory footprint by limiting the number of worker
# processes to two per-service when running in a VM.
openstack_service_workers: "{% raw %}{{ [ansible_facts.processor_vcpus, 2 if ansible_facts.virtualization_role == 'guest' else 5] | min }}{% endraw %}"
openstack_service_rpc_workers: "{% raw %}{{ [ansible_facts.processor_vcpus, 2 if ansible_facts.virtualization_role == 'guest' else 3] | min }}{% endraw %}"

# Glance Ceph configuration
glance_backend_ceph: "yes"

# Cinder Ceph configuration
cinder_backend_ceph: "yes"

# Nova Ceph configuration
nova_backend_ceph: "yes"

neutron_dns_domain: "{{ root_domain }}."

# OpenSearch memory tuning
opensearch_heap_size: 1g

# Octavia load balancer configuration.
#
# octavia_auto_configure is not set since removing it lets kolla's own default
# apply, which sets amphora in octavia_provider_drivers. That
# makes it true for the amphora driver and false for the OVN driver as needed

octavia_provider_drivers: "{{ 'ovn:OVN provider' if kolla_enable_ovn | bool else 'amphora:Amphora provider' }}"
octavia_provider_agents: "{{ 'ovn' if kolla_enable_ovn | bool else 'amphora_agent' }}"

# Host interface the health manager binds to. octavia.conf references this
# unconditionally, so fall back to the internal network on OVN, which is what
# kolla's api_interface default resolves to.
octavia_network_interface: "{{ (octavia_net_name if not kolla_enable_ovn | bool else internal_net_name) | net_interface(groups['controllers'][0]) }}"

# Management network registered by octavia_auto_configure, so only on OVS.
octavia_amp_network:
  name: lb-mgmt-net
  provider_network_type: vlan
  provider_segmentation_id: "{{ lb_mgmt_vlan }}"
  provider_physical_network: physnet1
  external: false
  shared: false
  subnet:
    name: lb-mgmt-subnet
    cidr: "{{ lb_mgmt_cidr }}"
    allocation_pool_start: "{{ lb_mgmt_neutron_allocation_pool_start }}"
    allocation_pool_end: "{{ lb_mgmt_neutron_allocation_pool_end }}"
    no_gateway_ip: true
    enable_dhcp: true

# Manila CephFS configuration
manila_cephfs_filesystem_name: manila-cephfs

# Designate configuration
designate_ns_record:
  - "ns1.mos.{{ root_domain | default('example.com') }}"
  - "ns2.mos.{{ root_domain | default('example.com') }}"
  - "ns3.mos.{{ root_domain | default('example.com') }}"
designate_backend: "bind9"
designate_recursion: "yes"
designate_forwarders_addresses: "1.1.1.1; 8.8.8.8"

# Open up ports in firewalld for services on the public API network.
enable_external_api_firewalld: true
external_api_firewalld_zone: "{{ public_net_name | net_zone }}"

# Cinder clustering requires more than one cinder-volume, which follows the controller count.
cinder_cluster_name: "{{ 'stackhpc_test_cinder_cluster' if groups['controllers'] | length > 1 else '' }}"

