---
# Kayobe global configuration.

###############################################################################
# OS distribution.

# OS distribution name. Valid options are "centos", "rocky", "ubuntu". Default
# is "rocky".
os_distribution: "rocky"

# OS release. Valid options are "10-stream" when os_distribution is "centos",
# "10" when os_distribution is "rocky", or "noble" when os_distribution is
# "ubuntu".
os_release: "10"
