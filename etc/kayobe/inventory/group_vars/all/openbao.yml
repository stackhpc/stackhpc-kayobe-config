###############################################################################
# Openbao deployment configuration.

# Registry information for seed.
seed_openbao_registry_url: "{{ stackhpc_docker_registry if stackhpc_sync_openbao_images | bool else '' }}"
seed_openbao_registry_username: "{{ stackhpc_docker_registry_username if stackhpc_sync_openbao_images | bool else '' }}"
seed_openbao_registry_password: "{{ stackhpc_docker_registry_password if stackhpc_sync_openbao_images | bool else '' }}"

# Seed OpenBao container image.
seed_openbao_docker_image: "{{ stackhpc_docker_registry ~ '/' if stackhpc_sync_openbao_images | bool else '' }}openbao/openbao"

# Seed OpenBao container image tag.
seed_openbao_docker_tag: "2.2.1"

# Seed OpenBao PKI Role name
seed_openbao_pki_role_name: "ServerCert"

# Seed OpenBao PKI Roles definition
seed_openbao_pki_roles:
  - name: "{{ seed_openbao_pki_role_name }}"
    config:
      max_ttl: 730d
      ttl: 730d
      allow_any_name: true
      allow_ip_sans: true
      require_cn: false
      server_flag: true
      key_type: rsa
      key_bits: 4096
      country: ["UK"]
      locality: ["Bristol"]
      organization: ["StackHPC"]
      ou: ["OpenStack"]

# Registry information for overcloud.
overcloud_openbao_registry_url: "{{ stackhpc_docker_registry if stackhpc_sync_openbao_images | bool else '' }}"
overcloud_openbao_registry_username: "{{ stackhpc_docker_registry_username if stackhpc_sync_openbao_images | bool else '' }}"
overcloud_openbao_registry_password: "{{ stackhpc_docker_registry_password if stackhpc_sync_openbao_images | bool else '' }}"

# Overcloud OpenBao container image.
overcloud_openbao_docker_image: "{{ stackhpc_docker_registry ~ '/' if stackhpc_sync_openbao_images | bool else '' }}openbao/openbao"

# Overcloud OpenBao container image tag.
overcloud_openbao_docker_tag: "2.2.1"

# Overcloud OpenBao PKI Default Role name
overcloud_openbao_pki_default_role_name: "ServerCert"

# Overcloud OpenBao PKI Internal TLS Role name
overcloud_openbao_pki_internal_tls_role_name: "{{ overcloud_openbao_pki_default_role_name }}"

# Overcloud OpenBao PKI Backend TLS Role name
overcloud_openbao_pki_backend_tls_role_name: "{{ overcloud_openbao_pki_default_role_name }}"

# Overcloud OpenBao PKI External TLS Role name (for testing only)
overcloud_openbao_pki_external_tls_role_name: "{{ overcloud_openbao_pki_default_role_name }}"

# Overcloud OpenBao PKI Roles definition
overcloud_openbao_pki_roles:
  - name: "{{ overcloud_openbao_pki_default_role_name }}"
    config:
      max_ttl: 730d
      ttl: 730d
      allow_any_name: true
      allow_ip_sans: true
      require_cn: false
      server_flag: true
      key_type: rsa
      key_bits: 4096
      country: ["UK"]
      locality: ["Bristol"]
      organization: ["StackHPC"]
      ou: ["OpenStack"]

seed_openbao_pki_certificate_subject:
  - common_name: "{% if kolla_internal_fqdn != kolla_internal_vip_address %}{{ kolla_internal_fqdn }}{% else %}overcloud{% endif %}"
    role: "{{ seed_openbao_pki_role_name }}"
    extra_params:
      ip_sans: "{% for host in groups['controllers'] %}{{ internal_net_name | net_ip(host) }}{% if not loop.last %},{% endif %}{% endfor %},{{ kolla_internal_vip_address }}"

# Enable OpenBao UI
openbao_enable_ui: true
