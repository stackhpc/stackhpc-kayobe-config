---
# Dict of Kolla image tags to deploy for each service.
# Each key is the tag variable prefix name, and the value is another dict,
# where the key is the OS distro and the value is the tag to deploy.

# NOTE(owenjones): When updating OVN or OVS in Rocky 9 containers, first
# rebuild the packages (update sources in stackhpc/ovn-build or
# stackhpc/ovs-build, then trigger a rebuild in our COPR repo), sync them
# to Release Train, and rebuild the Rocky 10 containers too. Otherwise a
# Rocky 9 -> 10 upgrade can downgrade OVN/OVS.

kolla_image_tags:
  openstack:
    rocky-9: 2025.1-rocky-9-20261031T093316
    rocky-10: 2025.1-rocky-10-20261031T093316
    ubuntu-noble: 2025.1-ubuntu-noble-20261031T093316
