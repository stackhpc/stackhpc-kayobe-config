# List of EPEL 9
stackhpc_epel_9_repos:
  - url: "{{ stackhpc_repo_epel_9_url }}"
    file: "epel.repo"
    tag: "epel"

# Repositories for Rocky Linux 10
stackhpc_rocky_10_repos:
  - url: "{{ stackhpc_repo_rocky_10_baseos_url }}"
    file: "rocky.repo"
    tag: "baseos"
  - url: "{{ stackhpc_repo_rocky_10_appstream_url }}"
    file: "rocky.repo"
    tag: "appstream"
  - url: "{{ stackhpc_repo_rocky_10_extras_url }}"
    file: "rocky-extras.repo"
    tag: "extras"

# NOTE(owenjones): Whether to feed in the .repo file needed for previous LTS
# versions of OVN/OVS - for now always include this in Rocky 10,
# when we switch over to newer LTS versions this might need some more conditions
stackhpc_enable_ovn_lts_repo: "{{ kolla_base_distro_and_version == 'rocky-10' }}"

# Additional repositories for Rocky Linux 10
stackhpc_rocky_10_additional_repos:
