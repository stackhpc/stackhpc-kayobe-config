  - url: "{{ stackhpc_repo_rocky_10_crb_url }}"
    file: "rocky.repo"
    tag: "crb"
  - url: "{{ stackhpc_repo_rocky_10_highavailability_url }}"
    file: "rocky-addons.repo"
    tag: "highavailability"
  # NOTE(owenjones): Remove this when previous OVN/OVS LTS versions
  # no longer required
  - url: "{{ stackhpc_repo_centos_stream_10_ovn_lts_url }}"
    file: "ovn-lts-centos-stream-10.repo"
    tag: "StackHPC-OVN-LTS"

# List of third-party repositories for Rocky Linux 10
stackhpc_rocky_10_third_party_repos:
  - url: "{{ stackhpc_repo_grafana_url }}"
    file: "grafana.repo"
    tag: "grafana"
  - url: "{{ stackhpc_repo_rhel_9_treasuredata_5_url }}"
    file: "td.repo"
    tag: "treasuredata"
  - url: "{{ stackhpc_repo_rhel_10_mariadb_10_11_url }}"
    file: "mariadb.repo"
    tag: "mariadb"
  - url: "{{ stackhpc_repo_rhel_9_influxdb_url }}"
    file: "influxdb.repo"
    tag: "influxdb"
  - url: "{{ stackhpc_repo_centos_stream_10_storage_ceph_squid_url }}"
    file: "CentOS-Ceph-Squid.repo"
    tag: "centos-ceph-squid"
  - url: "{{ stackhpc_repo_rhel9_rabbitmq_erlang_url }}"
    file: "rabbitmq_rabbitmq-erlang.repo"
    tag: "rabbitmq_rabbitmq-erlang"
  - url: "{{ stackhpc_repo_rhel9_rabbitmq_erlang_26_url }}"
    file: "copr-rabbitmq-erlang-26.repo"
    tag: "copr-rabbitmq-erlang-26"
  - url: "{{ stackhpc_repo_rhel9_rabbitmq_erlang_27_url }}"
    file: "copr-rabbitmq-erlang-27.repo"
    tag: "copr-rabbitmq-erlang-27"
  - url: "{{ stackhpc_repo_rhel9_rabbitmq_server_url }}"
    file: "rabbitmq_rabbitmq-server.repo"
    tag: "rabbitmq_rabbitmq-server"
  - url: "{{ stackhpc_repo_opensearch_2_x_url }}"
    file: "opensearch.repo"
    tag: "opensearch-2.x"
  - url: "{{ stackhpc_repo_opensearch_dashboards_2_x_url }}"
    file: "opensearch.repo"
    tag: "opensearch-dashboards-2.x"
  - url: "{{ stackhpc_repo_almalinux_9_proxysql_2_7_url }}"
    file: "proxysql.repo"
    tag: "proxysql"

# List of EPEL 10
stackhpc_epel_10_repos:
  - url: "{{ stackhpc_repo_epel_10_url }}"
    file: "epel.repo"
    tag: "epel"

base_centos_repo_overrides_post_yum_list: >-
  {% if kolla_base_distro_and_version == 'rocky-9' -%}
    {{ stackhpc_rocky_9_repos + stackhpc_epel_9_repos + stackhpc_rocky_9_additional_repos + stackhpc_rocky_9_third_party_repos }}
  {%- elif kolla_base_distro_and_version == 'rocky-10' -%}
    {{ stackhpc_rocky_10_repos + stackhpc_epel_10_repos + stackhpc_rocky_10_additional_repos + stackhpc_rocky_10_third_party_repos }}
  {%- else -%}
    []
  {%- endif %}

stackhpc_yum_repos: "{{ stackhpc_rocky_9_repos if kolla_base_distro_and_version == 'rocky-9' else stackhpc_rocky_10_repos if kolla_base_distro_and_version == 'rocky-10' else [] }}"

# Apt sources.list entry prefix.
# If using an authenticating Pulp proxy we need to trust the repository because
# the certificate provided by the upstream repo will not match the proxy's IP.
stackhpc_ubuntu_repo_prefix: "deb {% if stackhpc_repo_mirror_auth_proxy_enabled | bool %}[trusted=yes] {% endif %}"

# List of base repositories for Ubuntu Noble.
stackhpc_ubuntu_noble_base_repos:
  - "{{ stackhpc_ubuntu_repo_prefix }}{{ stackhpc_repo_ubuntu_noble_url }} noble main universe"
  - "{{ stackhpc_ubuntu_repo_prefix }}{{ stackhpc_repo_ubuntu_noble_url }} noble-updates main universe"
  - "{{ stackhpc_ubuntu_repo_prefix }}{{ stackhpc_repo_ubuntu_noble_url }} noble-backports main universe"
  - "{{ stackhpc_ubuntu_repo_prefix }}{{ stackhpc_repo_ubuntu_noble_security_url }} noble-security main universe"

# List of UCA repositories for Ubuntu Noble.
stackhpc_ubuntu_noble_uca_repos:
  - "{{ stackhpc_ubuntu_repo_prefix }}{{ stackhpc_repo_ubuntu_cloud_archive_url }} noble-updates/{{ openstack_release_codename }} main"

# List of repositories for Ubuntu Noble.
stackhpc_ubuntu_noble_repos: "{{ stackhpc_ubuntu_noble_base_repos + stackhpc_ubuntu_noble_uca_repos }}"

# Whether to revert to the upstream mirrors in built Kolla container images.
stackhpc_kolla_clean_up_repo_mirrors: true

# Dict mapping Jinja2 block names in kolla's Docker images to their contents.
kolla_build_blocks:
  base_header: |
    {% if kolla_base_distro == 'rocky' %}
    RUN \
    {% if stackhpc_kolla_clean_up_repo_mirrors | bool %}
        mkdir -p /etc/yum.repos.d.backup && \
        tar -czf /etc/yum.repos.d.backup/repos.tar.gz -C /etc/yum.repos.d . && \
    {% endif %}
    {% for repo in stackhpc_yum_repos %}
        sed -i -e '/\[{{ repo.tag }}\]/,/^\[/ s/^\(mirrorlist *=.*\)/#\1/g' \
               -e '/\[{{ repo.tag }}\]/,/^\[/ s/^[# ]*\(baseurl *=.*\)/#\1/g' \
               -e '/\[{{ repo.tag }}\]/,/^\[/ s/^[# ]*\(metalink *=.*\)/#\1/g' \
               -e '/\[{{ repo.tag }}\]/,/^\[/ s|^\(name.*\)|\1\nbaseurl={{ repo.url }}|' /etc/yum.repos.d/{{ repo.file }}{% if not loop.last %} && \
    {% endif %}
    {% endfor %}
    {% else %}
    RUN \
        rm -f /etc/apt/sources.list && \
        rm -f /etc/apt/sources.list.d/* && \
    {% if stackhpc_repo_mirror_auth_proxy_enabled | bool %}
    {# We lack the ca-certificates package at this stage, so don't verify the CA initially #}
        echo 'Acquire::https::Verify-Peer "false";' > /etc/apt/apt.conf.d/90no-verify-peer && \
    {% endif %}
    {% for repo in stackhpc_ubuntu_noble_base_repos %}
        echo '{{ repo }}' >> /etc/apt/sources.list {% if not loop.last %} && \
    {% endif %}
    {% endfor %}
    {% endif %}
  base_centos_repo_overrides_post_yum: |
    {# fixme #}
    {% if kolla_base_distro == 'rocky' %}
        && \
    {% if stackhpc_kolla_clean_up_repo_mirrors | bool %}
        tar -xzf /etc/yum.repos.d.backup/repos.tar.gz -C /etc/yum.repos.d && \
        tar -czf /etc/yum.repos.d.backup/repos.tar.gz -C /etc/yum.repos.d . && \
    {% endif %}
    {% if stackhpc_enable_ovn_lts_repo | bool %}
    echo -e "[StackHPC-OVN-LTS]\n\
    name=Copr repo for ovn-lts owned by @ovn-lts\n\
    baseurl=https://download.copr.fedorainfracloud.org/results/@ovn-lts/ovn-lts/centos-stream-\$releasever-\$basearch/\n\
    type=rpm-md\n\
    skip_if_unavailable=True\n\
    gpgcheck=1\n\
    gpgkey=https://download.copr.fedorainfracloud.org/results/@ovn-lts/ovn-lts/pubkey.gpg\n\
    repo_gpgcheck=0\n\
    enabled=1\n\
    enabled_metadata=1\n" > /etc/yum.repos.d/ovn-lts-centos-stream-10.repo && \
    {% endif %}
    {% for repo in base_centos_repo_overrides_post_yum_list %}
    if [ -f /etc/yum.repos.d/{{ repo.file }} ]; then \
        sed -i -e '/\[{{ repo.tag }}\]/,/^\[/ s/^\(mirrorlist *=.*\)/#\1/g' \
               -e '/\[{{ repo.tag }}\]/,/^\[/ s/^[# ]*\(baseurl *=.*\)/#\1/g' \
               -e '/\[{{ repo.tag }}\]/,/^\[/ s/^[ \t]*\(https.*\)/#\1/g' \
               -e '/\[{{ repo.tag }}\]/,/^\[/ s/^[# ]*\(metalink *=.*\)/#\1/g' \
               -e '/\[{{ repo.tag }}\]/,/^\[/ s|^\(name.*\)|\1\nbaseurl={{ repo.url }}|' /etc/yum.repos.d/{{ repo.file }}; \
    fi{% if not loop.last %} &&{% endif %} \
    {% endfor %}
        # NOTE(bbezak): RDO epoxy repo obsoletes many OVN versions
        # (see rdo-openvswitch.spec obsolete_ovn_versions:
        # https://git.centos.org/rpms/rdo-openvswitch/blob/c9s-sig-cloud-openstack-epoxy/f/SPECS/rdo-openvswitch.spec#L10),
        # which would replace our NFV OVS and OVN 24.03 LTS with 24.09. Hence exclude RDO OVN/OVS.
        && \
        if [ -f /etc/yum.repos.d/CentOS-OpenStack-epoxy.repo ]; then \
          sed -i '/^\[centos-openstack-epoxy\]/a excludepkgs=*rdo-ovn*,*rdo-openvswitch*' /etc/yum.repos.d/CentOS-OpenStack-epoxy.repo; \
        fi \
    {% endif %}
  # With the UCA keyring installed we can now add all repos.
  base_ubuntu_package_sources_list: |
    {% if stackhpc_kolla_clean_up_repo_mirrors | bool %}
    COPY sources.list.ubuntu /etc/apt/sources.list.backup
    {% endif %}
    RUN \
        rm -f /etc/apt/sources.list && \
        rm -f /etc/apt/sources.list.d/* && \
        rm -f /etc/apt/apt.conf.d/90no-verify-peer && \
    {% for repo in stackhpc_ubuntu_noble_repos %}
        echo '{{ repo }}' >> /etc/apt/sources.list {% if not loop.last %} && \
    {% endif %}
    {% endfor %}
  footer: |
    {% if stackhpc_kolla_clean_up_repo_mirrors | bool %}
    {% if kolla_base_distro == 'rocky' %}
    RUN \
        if [ -f /etc/yum.repos.d.backup/repos.tar.gz ]; then \
          tar -xzf /etc/yum.repos.d.backup/repos.tar.gz -C /etc/yum.repos.d && \
          rm -rf /etc/yum.repos.d.backup/; \
        fi && \
        {% if stackhpc_enable_ovn_lts_repo | bool %}
        if [ -f /etc/yum.repos.d/ovn-lts-centos-stream-10.repo ]; then \
          rm /etc/yum.repos.d/ovn-lts-centos-stream-10.repo; \
        fi && \
        {% endif %}
        if grep -r '{{ stackhpc_repo_mirror_url }}' /etc/yum.repos.d; then \
          echo "Found repository mirror in Yum repositories"; \
          exit 1; \
        fi
    {% else %}
    RUN \
        if [ -f /etc/apt/sources.list.backup ]; then \
          mv /etc/apt/sources.list.backup /etc/apt/sources.list; \
        fi && \
        if grep -r '{{ stackhpc_repo_mirror_url }}' /etc/apt/sources.list; then \
          echo "Found repository mirror in APT repositories"; \
          exit 1; \
        fi
    {% endif %}
    {% endif %}
  kolla_toolbox_header: |
    ENV UPPER_CONSTRAINTS_FILE=https://raw.githubusercontent.com/stackhpc/requirements/stackhpc/{{ openstack_release }}/upper-constraints.txt
  bifrost_base_header: |
    ADD additions-archive /
    ENV TOX_CONSTRAINTS_FILE=/requirements/upper-constraints.txt
  ironic_inspector_header: |
    ADD additions-archive /

# Dict mapping image customization variable names to their values.
# Each variable takes the form:
# <image name>_<customization>_<operation>
# Hyphens in the image name must be replaced with underscores. The
# customization is most commonly packages. The operation should be one of
# override, append or remove. The value should be a list.
kolla_build_customizations_common:
  bifrost_base_pip_packages_append:
    - /additions/*
