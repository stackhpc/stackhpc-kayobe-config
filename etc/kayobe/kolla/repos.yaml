---
ubuntu:
  ubuntu:
    url: "{{ stackhpc_repo_ubuntu_noble_url }}"
    suite: "noble noble-updates noble-backports"
    component: "main universe"
    gpg_key: "/usr/share/keyrings/ubuntu-archive-keyring.gpg"
    trusted: True
  ubuntu-security:
    url: "{{ stackhpc_repo_ubuntu_noble_security_url }}"
    suite: "noble-security"
    component: "main universe"
    gpg_key: "/usr/share/keyrings/ubuntu-archive-keyring.gpg"
    trusted: True
  ubuntu-cloud-archive:
    url: "{{ stackhpc_repo_ubuntu_cloud_archive_url }}"
    component: "main"
    gpg_key: "/usr/share/keyrings/ubuntu-cloud-keyring.gpg"
    suite: "noble-updates/{{ openstack_release_codename }}"
    trusted: True

rpm:
  appstream:
    baseurl: "{{ stackhpc_repo_rocky_10_appstream_url }}"
    gpgkey: "https://dl.rockylinux.org/pub/rocky/RPM-GPG-KEY-Rocky-10"
    name: "appstream"
  baseos:
    baseurl: "{{ stackhpc_repo_rocky_10_baseos_url }}"
    gpgkey: "https://dl.rockylinux.org/pub/rocky/RPM-GPG-KEY-Rocky-10"
    name: "baseos"
  ceph:
    baseurl: "{{ stackhpc_repo_centos_stream_10_storage_ceph_squid_url }}"
    gpgkey: "https://www.centos.org/keys/RPM-GPG-KEY-CentOS-SIG-Storage"
    name: "centos-ceph-squid"
  crb:
    baseurl: "{{ stackhpc_repo_rocky_10_crb_url }}"
    gpgkey: "https://dl.rockylinux.org/pub/rocky/RPM-GPG-KEY-Rocky-10"
    name: "crb"
  docker-ce:
    baseurl: "{{ stackhpc_repo_centos_stream_10_docker_url }}"
    gpgkey: "https://download.docker.com/linux/centos/gpg"
    name: "docker-ce"
  epel:
    baseurl: "{{ stackhpc_repo_epel_10_url }}"
    gpgkey: "https://dl.fedoraproject.org/pub/epel/RPM-GPG-KEY-EPEL-$releasever"
    name: "epel"
  erlang:
    baseurl: "{{ stackhpc_repo_rhel9_rabbitmq_erlang_url }}"
    gpgkey: "https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-erlang.E495BB49CC4BBE5B.key"
    name: "rabbitmq_rabbitmq-erlang"
  extras:
    baseurl: "{{ stackhpc_repo_rocky_10_extras_url }}"
    gpgkey: "https://dl.rockylinux.org/pub/rocky/RPM-GPG-KEY-Rocky-10"
    name: "extras"
  fluentd:
    baseurl: "{{ stackhpc_repo_rhel_10_fluent_6_url }}"
    gpgkey: "https://fluentd.cdn.cncf.io/GPG-KEY-fluent-package"
    name: "fluent-package-lts"
  grafana:
    baseurl: "{{ stackhpc_repo_grafana_url }}"
    gpgkey: "https://rpm.grafana.com/gpg.key"
    name: "grafana"
  hacluster:
    baseurl: "{{ stackhpc_repo_rocky_10_highavailability_url }}"
    gpgkey: "https://dl.rockylinux.org/pub/rocky/RPM-GPG-KEY-Rocky-10"
    name: "highavailability"
  mariadb:
    baseurl: "{{ stackhpc_repo_rhel_10_mariadb_11_4_url }}"
    gpgkey: "https://downloads.mariadb.com/MariaDB/RPM-GPG-KEY-MariaDB"
    name: "mariadb"
  opensearch:
    baseurl: "{{ stackhpc_repo_opensearch_3_x_yum_url }}"
    gpgkey: "https://artifacts.opensearch.org/publickeys/opensearch-release.pgp"
    repo_gpgcheck: 1
    name: "opensearch-3.x"
  opensearch-dashboards:
    baseurl: "{{ stackhpc_repo_opensearch_dashboards_3_x_yum_url }}"
    gpgkey: "https://artifacts.opensearch.org/publickeys/opensearch-release.pgp"
    repo_gpgcheck: 1
    name: "opensearch-dashboards-3.x"
  openvswitch:
    baseurl: "{{ stackhpc_repo_centos_stream_10_nfv_openvswitch_url }}"
    gpgkey: "https://www.centos.org/keys/RPM-GPG-KEY-CentOS-SIG-NFV"
    name: "centos-nfv-openvswitch"
  proxysql:
    baseurl: "{{ stackhpc_repo_almalinux_10_proxysql_3_0_url }}"
    gpgkey: "https://repo.proxysql.com/ProxySQL/proxysql-3.0.x/repo_pub_key"
    name: "proxysql"
  rabbitmq:
    baseurl: "{{ stackhpc_repo_rhel9_rabbitmq_server_url }}"
    gpgkey: |
      https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-server.9F4587F226208342.key
      https://github.com/rabbitmq/signing-keys/releases/download/3.0/rabbitmq-release-signing-key.asc
    name: "rabbitmq_rabbitmq-server"
  security:
    baseurl: "{{ stackhpc_repo_rocky_10_security_url }}"
    gpgkey: "https://dl.rockylinux.org/pub/rocky/RPM-GPG-KEY-Rocky-10"
    name: "security"

rocky-aarch64:
  erlang:
    baseurl: "{{ stackhpc_repo_rhel9_rabbitmq_erlang_27_url }}"
    gpgkey: "https://download.copr.fedorainfracloud.org/results/@openstack-kolla/rabbitmq-erlang-27/pubkey.gpg"
    name: "copr-rabbitmq-erlang"
