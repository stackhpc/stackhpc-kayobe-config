---
###############################################################################
# Local Pulp server configuration

# Base URL of the local Pulp service.
# Default uses the seed node's IP on the admin network.
pulp_url: "{{ 'https' if pulp_enable_tls | bool else 'http' }}://{{ lookup('vars', admin_oc_net_name ~ '_ips')[groups.seed.0] }}:{{ pulp_port }}"

# Port on the seed node's interface on the admin network that the Pulp service
# listens on.
pulp_port: "{{ '443' if pulp_enable_tls | bool else '80' }}"

# Whether to enable TLS for Pulp.
pulp_enable_tls: false

# Path to a TLS certificate to use when TLS is enabled.
pulp_cert_path: "{{ kayobe_env_config_path ~ '/pulp/certificates/pulp.crt' if pulp_enable_tls | bool else '' }}"

# Path to a TLS key to use when TLS is enabled.
pulp_key_path: "{{ kayobe_env_config_path ~ '/pulp/certificates/pulp.key' if pulp_enable_tls | bool else '' }}"

###############################################################################
# Local Pulp access credentials

# Credentials used to access the local Pulp REST API.
pulp_username: admin
pulp_password: "{{ secrets_pulp_password }}"

# Credentials for non-admin user within Pulp.
pulp_stack_username: stack
pulp_stack_password: "{{ secrets_pulp_stack_password | default('') }}"

# Proxy to use when adding remotes.
pulp_proxy_url: "{{ omit }}"

###############################################################################
# StackHPC Pulp server

# The scheme of the StackHPC Pulp service (http or https)
stackhpc_release_pulp_scheme: "https"

# The domain of the StackHPC Pulp service.
stackhpc_release_pulp_domain: "ark.stackhpc.com"

# Base URL of the StackHPC Pulp service.
stackhpc_release_pulp_url: "{{ stackhpc_release_pulp_scheme }}://{{ stackhpc_release_pulp_domain }}"

# Credentials used to access the StackHPC Pulp service.
stackhpc_release_pulp_username:
stackhpc_release_pulp_password:

# Content URL of the StackHPC Pulp service.
stackhpc_release_pulp_content_url: "{{ stackhpc_release_pulp_url }}/pulp/content"

# Content URL of the StackHPC Pulp service, with basic auth.
# NOTE(Alex-Welsh): This may need reworking if it reveals the credentials
# at runtime in the ansible output
stackhpc_release_pulp_content_url_with_auth: "{{ stackhpc_release_pulp_scheme }}://{{ stackhpc_release_pulp_username }}:{{ stackhpc_release_pulp_password }}@{{ stackhpc_release_pulp_domain }}/pulp/content"

# Sync all repositories required for building Kolla images from the
# StackHPC Ark Pulp service to local Pulp.
# NOTE: Only RPM repositories are supported.
stackhpc_pulp_sync_for_local_container_build: false

# Set the CA bundle used by Python `requests`.
stackhpc_requests_ca_bundle: >-
  {{
    '/etc/pki/tls/certs/ca-bundle.crt'
    if ansible_facts.os_family == 'RedHat'
    else '/etc/ssl/certs/ca-certificates.crt'
  }}

###############################################################################
# Debs

# Whether to sync Ubuntu packages.
stackhpc_pulp_sync_ubuntu_noble: "{{ os_distribution == 'ubuntu' }}"

# Default configuration, which each element of stackhpc_pulp_deb_repos
# is combined with
stackhpc_pulp_deb_repos_default_config:
  remote_username: "{{ stackhpc_release_pulp_username }}"
  remote_password: "{{ stackhpc_release_pulp_password }}"
  client_cert: ""
  client_key: ""
  policy: on_demand
  proxy_url: "{{ pulp_proxy_url }}"
  architectures: amd64
  mirror: true
  state: present

# Deb repositories
stackhpc_pulp_deb_repos:
  # Base Ubuntu Noble repositories
  - name: "Ubuntu Noble"
    url: "{{ stackhpc_release_pulp_content_url }}/ubuntu/noble/{{ stackhpc_pulp_repo_ubuntu_noble_version }}"
    distribution_name: "ubuntu-noble-"
    base_path: "ubuntu/noble/"
    components: "main restricted universe"
    distributions: "noble noble-updates noble-backports"
    required: "{{ stackhpc_pulp_sync_ubuntu_noble | bool }}"

  - name: "Ubuntu Noble security"
    url: "{{ stackhpc_release_pulp_content_url }}/ubuntu/noble-security/{{ stackhpc_pulp_repo_ubuntu_noble_security_version }}"
    distribution_name: "ubuntu-noble-security-"
    base_path: "ubuntu/noble-security/"
    components: "main restricted universe"
    distributions: "noble-security"
    required: "{{ stackhpc_pulp_sync_ubuntu_noble | bool }}"

  # Ubuntu Cloud Archive (UCA) repositories
  - name: "Ubuntu Cloud Archive"
    url: "{{ stackhpc_release_pulp_content_url }}/ubuntu-cloud-archive/{{ stackhpc_pulp_repo_ubuntu_cloud_archive_version }}"
    distribution_name: "ubuntu-cloud-archive-"
    base_path: "ubuntu-cloud-archive/"
    components: "main"
    distributions: "noble-updates/{{ openstack_release_codename }}"
    required: "{{ stackhpc_pulp_sync_ubuntu_noble | bool }}"

  # Third-party repositories
  - name: "Docker CE for Ubuntu Noble"
    url: "{{ stackhpc_release_pulp_content_url }}/docker-ce/ubuntu-noble/{{ stackhpc_pulp_repo_docker_ce_ubuntu_noble_version }}"
    distribution_name: "docker-ce-for-ubuntu-noble-"
    base_path: "docker-ce/ubuntu-noble/"
    distributions: "noble"
    components: "stable"
    required: "{{ stackhpc_pulp_sync_ubuntu_noble | bool }}"

# Publication format is a subset of distribution.
stackhpc_pulp_publication_deb_development: "{{ stackhpc_pulp_distribution_deb_development }}"

# Content is made available at well-known distribution names for development,
# production.

stackhpc_pulp_repository_deb_repos: >-
  {%- set deb_repos = [] -%}
  {%- for repo in stackhpc_pulp_deb_repos -%}
  {%- set deb_repo = {"name": repo.name} -%}
  {%- set deb_repo = deb_repo | combine({"url": repo.url}) -%}
  {%- set deb_repo = deb_repo | combine({"required": repo.required}) -%}
  {%- if "policy" in repo -%}
  {%- set deb_repo = deb_repo | combine({"policy": repo.policy}) -%}
  {%- endif -%}
  {%- if "mirror" in repo -%}
  {%- set deb_repo = deb_repo | combine({"mirror": repo.mirror}) -%}
  {%- endif -%}
  {%- if "distributions" in repo -%}
  {%- set deb_repo = deb_repo | combine({"distributions": repo.distributions}) -%}
  {%- endif -%}
  {%- if "components" in repo -%}
  {%- set deb_repo = deb_repo | combine({"components": repo.components}) -%}
  {%- endif -%}
  {%- if "architectures" in repo -%}
  {%- set deb_repo = deb_repo | combine({"architectures": repo.architectures}) -%}
  {%- endif -%}
  {%- set _ = deb_repos.append(stackhpc_pulp_deb_repos_default_config | combine(deb_repo)) -%}
  {%- endfor -%}
  {{ deb_repos }}

stackhpc_pulp_deb_dists_default_config:
  state: present
  mode: verbatim

# Development tracks the release repositories.
stackhpc_pulp_distribution_deb_development: >-
  {%- set dev_dists = [] -%}
  {%- for repo in stackhpc_pulp_deb_repos -%}
  {%- set name = repo.distribution_name ~ 'development' -%}
  {%- set base_path = repo.base_path ~ 'development' -%}
  {%- set dev_dist = {
                      "name": name,
                      "repository": repo.name,
                      "base_path": base_path,
                      "required": repo.required
                      }
                    -%}
  {%- if "mode" in repo -%}
  {%- set dev_dist = dev_dist | combine({"mode": repo.mode}) -%}
  {%- endif -%}
  {%- set _ = dev_dists.append(stackhpc_pulp_deb_dists_default_config | combine(dev_dist)) -%}
  {%- endfor -%}
  {{ dev_dists }}

# Development gets promoted to production.
stackhpc_pulp_distribution_deb_production: >-
  {%- set prod_dists = [] -%}
  {%- for repo in stackhpc_pulp_deb_repos -%}
  {%- set name = repo.distribution_name ~ 'production' -%}
  {%- set base_path = repo.base_path ~ 'production' -%}
  {%- set prod_dist = {
                      "name": name,
                      "distribution": repo.distribution_name ~ 'development',
                      "base_path": base_path,
                      "required": repo.required
                      }
                    -%}
  {%- if "mode" in repo -%}
  {%- set prod_dist = prod_dist | combine({"mode": repo.mode}) -%}
  {%- endif -%}
  {%- set _ = prod_dists.append(stackhpc_pulp_deb_dists_default_config | combine(prod_dist)) -%}
  {%- endfor -%}
  {{ prod_dists }}

###############################################################################
# RPMs

# Content comes in from release repositories, via pinned repo versions.

# Whether to sync Rocky Linux 9 packages.
stackhpc_pulp_sync_rocky_9: "{{ os_distribution == 'rocky' and os_release == '9' }}"
# Rocky 9 minor version number. Supported values: 6, 7, 8. Default is 8.
stackhpc_pulp_repo_rocky_9_minor_version: '8'
# Rocky 9 Snapshot versions. The defaults use the appropriate version from
# pulp-repo-versions.yml for the selected minor release.

# Define the architecture suffix
arch_suffix: "{{ '_aarch64' if kolla_base_arch == 'aarch64' else '' }}"

# Rocky 9 selected-architecture snapshot versions.
# NOTE(bbezak): Existing CI build and repo URL configuration uses these
# variables as selected-architecture aliases that follow kolla_base_arch.
# Pulp repo sync should use the explicit architecture-specific variables below.
stackhpc_pulp_repo_rocky_9_baseos_version: "{{ stackhpc_pulp_repo_rocky_9_baseos_aarch64_version if kolla_base_arch == 'aarch64' else stackhpc_pulp_repo_rocky_9_baseos_x86_64_version }}"
stackhpc_pulp_repo_rocky_9_appstream_version: "{{ stackhpc_pulp_repo_rocky_9_appstream_aarch64_version if kolla_base_arch == 'aarch64' else stackhpc_pulp_repo_rocky_9_appstream_x86_64_version }}"
stackhpc_pulp_repo_rocky_9_extras_version: "{{ stackhpc_pulp_repo_rocky_9_extras_aarch64_version if kolla_base_arch == 'aarch64' else stackhpc_pulp_repo_rocky_9_extras_x86_64_version }}"
stackhpc_pulp_repo_rocky_9_crb_version: "{{ stackhpc_pulp_repo_rocky_9_crb_aarch64_version if kolla_base_arch == 'aarch64' else stackhpc_pulp_repo_rocky_9_crb_x86_64_version }}"
stackhpc_pulp_repo_rocky_9_highavailability_version: "{{ stackhpc_pulp_repo_rocky_9_highavailability_aarch64_version if kolla_base_arch == 'aarch64' else stackhpc_pulp_repo_rocky_9_highavailability_x86_64_version }}"
stackhpc_pulp_repo_rocky_9_security_version: "{{ stackhpc_pulp_repo_rocky_9_security_aarch64_version if kolla_base_arch == 'aarch64' else stackhpc_pulp_repo_rocky_9_security_x86_64_version }}"

# Rocky 9 architecture-specific snapshot versions.
stackhpc_pulp_repo_rocky_9_baseos_x86_64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_' ~ stackhpc_pulp_repo_rocky_9_minor_version ~ '_baseos_version') }}"
stackhpc_pulp_repo_rocky_9_appstream_x86_64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_' ~ stackhpc_pulp_repo_rocky_9_minor_version ~ '_appstream_version') }}"
stackhpc_pulp_repo_rocky_9_extras_x86_64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_' ~ stackhpc_pulp_repo_rocky_9_minor_version ~ '_extras_version') }}"
stackhpc_pulp_repo_rocky_9_crb_x86_64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_' ~ stackhpc_pulp_repo_rocky_9_minor_version ~ '_crb_version') }}"
stackhpc_pulp_repo_rocky_9_highavailability_x86_64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_' ~ stackhpc_pulp_repo_rocky_9_minor_version ~ '_highavailability_version') }}"
stackhpc_pulp_repo_rocky_9_security_x86_64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_' ~ stackhpc_pulp_repo_rocky_9_minor_version ~ '_security_version') }}"
stackhpc_pulp_repo_rocky_9_baseos_aarch64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_' ~ stackhpc_pulp_repo_rocky_9_minor_version ~ '_baseos_aarch64_version') }}"
stackhpc_pulp_repo_rocky_9_appstream_aarch64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_' ~ stackhpc_pulp_repo_rocky_9_minor_version ~ '_appstream_aarch64_version') }}"
stackhpc_pulp_repo_rocky_9_extras_aarch64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_' ~ stackhpc_pulp_repo_rocky_9_minor_version ~ '_extras_aarch64_version') }}"
stackhpc_pulp_repo_rocky_9_crb_aarch64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_' ~ stackhpc_pulp_repo_rocky_9_minor_version ~ '_crb_aarch64_version') }}"
stackhpc_pulp_repo_rocky_9_highavailability_aarch64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_' ~ stackhpc_pulp_repo_rocky_9_minor_version ~ '_highavailability_aarch64_version') }}"
stackhpc_pulp_repo_rocky_9_security_aarch64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_' ~ stackhpc_pulp_repo_rocky_9_minor_version ~ '_security_aarch64_version') }}"

# Rocky 9 Multiarch repositories
#NOTE(bbezak): Versioned Erlang repos (aarch64 only). Fallback to generic Erlang version if not defined.
stackhpc_pulp_repo_multiarch_rhel9_rabbitmq_erlang_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rhel9_rabbitmq_erlang' ~ arch_suffix ~ '_version', default=stackhpc_pulp_repo_rhel9_rabbitmq_erlang_version) }}"
stackhpc_pulp_repo_multiarch_rhel9_rabbitmq_erlang_26_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rhel9_rabbitmq_erlang_26' ~ arch_suffix ~ '_version', default=stackhpc_pulp_repo_multiarch_rhel9_rabbitmq_erlang_version) }}"
stackhpc_pulp_repo_multiarch_rhel9_rabbitmq_erlang_27_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rhel9_rabbitmq_erlang_27' ~ arch_suffix ~ '_version', default=stackhpc_pulp_repo_multiarch_rhel9_rabbitmq_erlang_version) }}"
stackhpc_pulp_repo_multiarch_centos_stream_9_nfv_openvswitch_version: "{{ lookup('vars', 'stackhpc_pulp_repo_centos_stream_9_nfv_openvswitch' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_centos_stream_9_openstack_epoxy_version: "{{ lookup('vars', 'stackhpc_pulp_repo_centos_stream_9_openstack_epoxy' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_centos_stream_9_opstools_version: "{{ lookup('vars', 'stackhpc_pulp_repo_centos_stream_9_opstools' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_centos_stream_9_storage_ceph_squid_version: "{{ lookup('vars', 'stackhpc_pulp_repo_centos_stream_9_storage_ceph_squid' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_centos_stream_9_docker_version: "{{ lookup('vars', 'stackhpc_pulp_repo_centos_stream_9_docker' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_rhel_9_treasuredata_5_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rhel_9_treasuredata_5' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_rhel_9_mariadb_10_11_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rhel_9_mariadb_10_11' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_rhel_9_influxdb_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rhel_9_influxdb' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_epel_9_version: "{{ lookup('vars', 'stackhpc_pulp_repo_epel_9' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_rocky_9_sig_security_common_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_9_sig_security_common' ~ arch_suffix ~ '_version') }}"

# Whether to sync packages common to all RHEL 9 derivatives.
stackhpc_pulp_sync_el_9: "{{ stackhpc_pulp_sync_rocky_9 | bool }}"

# RPM architectures to sync from StackHPC Ark Pulp into local Pulp.
# Valid values are "x86_64" and "aarch64".
stackhpc_pulp_rpm_architectures:
  - x86_64

# Whether to sync Rocky Linux 10 packages.
stackhpc_pulp_sync_rocky_10: "{{ os_distribution == 'rocky' and os_release == '10' }}"
# Rocky 10 minor version number. Supported values: 1, 2. Default is 2
stackhpc_pulp_repo_rocky_10_minor_version: '2'
# Rocky 10 Snapshot versions. The defaults use the appropriate version from
# pulp-repo-versions.yml for the selected minor release.

# Rocky 10 selected-architecture snapshot versions.
# NOTE(bbezak): Existing CI build and repo URL configuration uses these
# variables as selected-architecture aliases that follow kolla_base_arch.
# Pulp repo sync should use the explicit architecture-specific variables below.
stackhpc_pulp_repo_rocky_10_appstream_version: "{{ stackhpc_pulp_repo_rocky_10_appstream_aarch64_version if kolla_base_arch == 'aarch64' else stackhpc_pulp_repo_rocky_10_appstream_x86_64_version }}"
stackhpc_pulp_repo_rocky_10_baseos_version: "{{ stackhpc_pulp_repo_rocky_10_baseos_aarch64_version if kolla_base_arch == 'aarch64' else stackhpc_pulp_repo_rocky_10_baseos_x86_64_version }}"
stackhpc_pulp_repo_rocky_10_extras_version: "{{ stackhpc_pulp_repo_rocky_10_extras_aarch64_version if kolla_base_arch == 'aarch64' else stackhpc_pulp_repo_rocky_10_extras_x86_64_version }}"
stackhpc_pulp_repo_rocky_10_crb_version: "{{ stackhpc_pulp_repo_rocky_10_crb_aarch64_version if kolla_base_arch == 'aarch64' else stackhpc_pulp_repo_rocky_10_crb_x86_64_version }}"
stackhpc_pulp_repo_rocky_10_highavailability_version: "{{ stackhpc_pulp_repo_rocky_10_highavailability_aarch64_version if kolla_base_arch == 'aarch64' else stackhpc_pulp_repo_rocky_10_highavailability_x86_64_version }}"
stackhpc_pulp_repo_rocky_10_security_version: "{{ stackhpc_pulp_repo_rocky_10_security_aarch64_version if kolla_base_arch == 'aarch64' else stackhpc_pulp_repo_rocky_10_security_x86_64_version }}"

# Rocky 10 architecture-specific snapshot versions.
stackhpc_pulp_repo_rocky_10_appstream_x86_64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_10_' ~ stackhpc_pulp_repo_rocky_10_minor_version ~ '_appstream_version') }}"
stackhpc_pulp_repo_rocky_10_baseos_x86_64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_10_' ~ stackhpc_pulp_repo_rocky_10_minor_version ~ '_baseos_version') }}"
stackhpc_pulp_repo_rocky_10_extras_x86_64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_10_' ~ stackhpc_pulp_repo_rocky_10_minor_version ~ '_extras_version') }}"
stackhpc_pulp_repo_rocky_10_crb_x86_64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_10_' ~ stackhpc_pulp_repo_rocky_10_minor_version ~ '_crb_version') }}"
stackhpc_pulp_repo_rocky_10_highavailability_x86_64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_10_' ~ stackhpc_pulp_repo_rocky_10_minor_version ~ '_highavailability_version') }}"
stackhpc_pulp_repo_rocky_10_security_x86_64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_10_' ~ stackhpc_pulp_repo_rocky_10_minor_version ~ '_security_version') }}"
stackhpc_pulp_repo_rocky_10_appstream_aarch64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_10_' ~ stackhpc_pulp_repo_rocky_10_minor_version ~ '_appstream_aarch64_version') }}"
stackhpc_pulp_repo_rocky_10_baseos_aarch64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_10_' ~ stackhpc_pulp_repo_rocky_10_minor_version ~ '_baseos_aarch64_version') }}"
stackhpc_pulp_repo_rocky_10_extras_aarch64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_10_' ~ stackhpc_pulp_repo_rocky_10_minor_version ~ '_extras_aarch64_version') }}"
stackhpc_pulp_repo_rocky_10_crb_aarch64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_10_' ~ stackhpc_pulp_repo_rocky_10_minor_version ~ '_crb_aarch64_version') }}"
stackhpc_pulp_repo_rocky_10_highavailability_aarch64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_10_' ~ stackhpc_pulp_repo_rocky_10_minor_version ~ '_highavailability_aarch64_version') }}"
stackhpc_pulp_repo_rocky_10_security_aarch64_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rocky_10_' ~ stackhpc_pulp_repo_rocky_10_minor_version ~ '_security_aarch64_version') }}"

# Rocky 10 Multiarch repositories
stackhpc_pulp_repo_multiarch_centos_stream_10_nfv_openvswitch_version: "{{ lookup('vars', 'stackhpc_pulp_repo_centos_stream_10_nfv_openvswitch' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_centos_stream_10_openstack_epoxy_version: "{{ lookup('vars', 'stackhpc_pulp_repo_centos_stream_10_openstack_epoxy' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_centos_stream_10_ovn_lts_version: "{{ lookup('vars', 'stackhpc_pulp_repo_centos_stream_10_ovn_lts' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_centos_stream_10_storage_ceph_squid_version: "{{ lookup('vars', 'stackhpc_pulp_repo_centos_stream_10_storage_ceph_squid' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_centos_stream_10_docker_version: "{{ lookup('vars', 'stackhpc_pulp_repo_centos_stream_10_docker' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_rhel_10_mariadb_10_11_version: "{{ lookup('vars', 'stackhpc_pulp_repo_rhel_10_mariadb_10_11' ~ arch_suffix ~ '_version') }}"
stackhpc_pulp_repo_multiarch_epel_10_version: "{{ lookup('vars', 'stackhpc_pulp_repo_epel_10' ~ arch_suffix ~ '_version') }}"

# Whether to sync packages common to all RHEL 10 derivatives.
stackhpc_pulp_sync_el_10: "{{ stackhpc_pulp_sync_rocky_10 | bool }}"

# Default configuration, which each element of stackhpc_pulp_rpm_repos
# is combined with
stackhpc_pulp_rpm_repos_default_config:
  remote_username: "{{ stackhpc_release_pulp_username }}"
  remote_password: "{{ stackhpc_release_pulp_password }}"
  client_cert: ""
  client_key: ""
  policy: on_demand
  proxy_url: "{{ pulp_proxy_url }}"
  sync_policy: mirror_complete
  state: present

stackhpc_pulp_rpm_repos:
  # Repositories common to both Rocky 9 and 10
  - name: Grafana
    url: "{{ stackhpc_release_pulp_content_url }}/grafana/oss/rpm/{{ stackhpc_pulp_repo_grafana_version }}"
    distribution_name: "grafana-"
    base_path: "grafana/oss/rpm/"
    required: "{{ stackhpc_pulp_sync_for_local_container_build | bool and (stackhpc_pulp_sync_el_9 | bool or stackhpc_pulp_sync_el_10 | bool) }}"

  - name: RabbitMQ - Erlang - RHEL 9
    url: "{{ stackhpc_release_pulp_content_url }}/rabbitmq/erlang/el/9/x86_64/{{ stackhpc_pulp_repo_rhel9_rabbitmq_erlang_version }}"
