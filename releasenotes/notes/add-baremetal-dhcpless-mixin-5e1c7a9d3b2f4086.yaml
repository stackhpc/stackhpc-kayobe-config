---
features:
  - |
    Adds a ``baremetal-dhcpless`` mixin environment, which depends on the
    ``baremetal`` environment and adds support for DHCP-less deployment of
    baremetal nodes using Redfish virtual media. Nodes added to the
    ``baremetal-dhcpless`` inventory group have their MAC address discovered
    using out-of-band Redfish inspection, and their ``network_data``, boot
    interface and port set by a ``kayobe baremetal compute register`` hook.
    See the :ref:`mixin documentation <mixin-baremetal-dhcpless>` for details.
