---
features:
  - |
    The playbook ``nova-compute-drain.yml`` now supports performing a cold
    migration which can be set via ``nova_compute_drain_live_migration``
    it defaults to performing a live migration.
    
    The playbook ``nova-compute-drain.yml`` now supports providing a
    desired destination host for instances to be migrated this can be
    set via ``nova_compute_drain_destination`` defaults to to no host
    and therefore does not perform a targeted migration.
