---
features:
  - |
    Adds OpenBao monitoring support, including Prometheus scrape configuration,
    Prometheus alerts for sealed and unhealthy overcloud OpenBao nodes, and an
    OpenBao Grafana dashboard. OpenBao monitoring can be disabled by setting
    ``stackhpc_enable_openbao_monitoring`` to ``false``.
upgrade:
  - |
    Existing OpenBao deployments should rerun
    ``ansible/secret-store/secret-store-deploy-overcloud.yml`` to enable
    unauthenticated metrics access,and then reconfigure Prometheus and Grafana
    to apply the new scrape configuration, alerting rules, and dashboard.
