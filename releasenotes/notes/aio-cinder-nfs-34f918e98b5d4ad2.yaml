---
features:
  - |
    Enables Cinder in the ``aio`` environment, backed by an NFS share exported
    from the controller at ``/var/lib/cinder-nfs``. This gives the all-in-one
    Tempest run coverage of the volume tests. An NFS server is installed on the
    controller during host configuration. Cinder backup is not enabled, as its
    default driver is Ceph and no Ceph cluster is deployed in this environment.
other:
  - |
    Cinder volumes in the ``aio`` environment consume space on the ``lv_var``
    logical volume, which is 5GB. A workload that writes heavily to volumes 
    could potentially fill ``/var``.
  - |
    A dedicated logical volume for the share was considered instead. It was
    rejected because ``lv_docker`` already claims 95% of the free space in
    ``rootvg``, leaving too little to carve a new volume on a host that has
    already been deployed. Exporting from under ``/var`` was chosen as the 
    comparitively safer option.
