---
features:
  - |
    The ``ci-aio`` Kayobe environment has been split into two distinct
    environments:

    * ``aio``: Designed for manual deployment, making it significantly easier
      for users to set up an environment for testing and development.
    * ``ci-aio``: Dedicated to CI testing.

    The ``aio`` environment contains the core logic, while ``ci-aio`` inherits
    from it and applies CI-specific overrides.

    Note that the ``aio`` environment continues to use StackHPC Release Train
    content, and therefore still requires credentials for ``ark.stackhpc.com``
    to run.
