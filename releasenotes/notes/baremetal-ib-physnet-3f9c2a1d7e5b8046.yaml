---
features:
  - |
    The ``baremetal`` environment now enables the ``ib_physnet`` inspection
    hook from ``stackhpc-inspector-plugins``, and sets ``[port_physnet]
    ib_physnet`` to ``ibphysnet`` in ``ironic-conductor.conf``. Infiniband
    ports discovered during inspection will have their ``physical_network``
    set to ``ibphysnet``.
