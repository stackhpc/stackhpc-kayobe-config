---
features:
  - |
    Bifrost now supports providing authentication credentials when fetching the
    deployment image.
upgrade:
  - |
    Bifrost no longer supports inserting credentials into
    ``custom_deploy_image_upstream_url`` and
    ``custom_deploy_image_checksum_url``. Instead, credentials can be provided
    using ``deploy_image_url_username``, ``deploy_image_url_password``,
    ``deploy_image_force_basic_auth``, and
    ``deploy_image_unredirected_headers``.
security:
  - |
    Bifrost no longer supports inserting credentials into
    ``custom_deploy_image_upstream_url`` and
    ``custom_deploy_image_checksum_url``, which would be printed in the logs
    if fetching the image failed.
