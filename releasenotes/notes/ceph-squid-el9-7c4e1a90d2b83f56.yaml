---
security:
  - |
    Ceph in Rocky Linux 9 container images is updated from Squid 19.2.5 to
    Squid 19.2.6. This fixes CVE-2025-30156, CVE-2026-39944, CVE-2026-50152
    and CVE-2026-54330. The packages now come from download.ceph.com, because
    the CentOS Storage SIG only built Squid 19.2.5 for el9.
  - |
    Rocky Linux 10 container images are rebuilt with Ceph Squid 19.2.6 from
    the CentOS Storage SIG, which fixes the same CVEs.
