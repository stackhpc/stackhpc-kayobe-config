---
upgrade:
  - |
    Updates ``stackhpc-inspector-plugins`` to
    `2.0.0 <https://github.com/stackhpc/stackhpc-inspector-plugins/releases/tag/2.0.0>`__.
    This release ports the plugins to work with Ironic's built-in inspector,
    so they are now installed into the ``ironic-conductor`` image instead of
    the (now removed) standalone ``ironic-inspector`` image. The
    ``system_name_llc`` hook has been removed upstream in favour of Ironic's
    built-in ``local-link-connection`` hook, which is now enabled via
    ``inspector_hooks_extra`` in the ``baremetal`` environment.
