---
features:
  - |
    Add support for environment-specific Kolla image tag overrides.

    ``tools/kolla-images.py`` now loads image tags from
    ``etc/kayobe/kolla-image-tags.yml`` and, when ``KAYOBE_ENVIRONMENT`` is set,
    also loads
    ``etc/kayobe/environments/$KAYOBE_ENVIRONMENT/kolla-image-tags.yml``.

    Environment values are merged on top of the base file, so per-environment
    tag overrides take precedence while unspecified tags continue to inherit
    from the base configuration.
