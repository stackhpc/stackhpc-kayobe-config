---
fixes:
  - |
    Updates Neutron container images to fix `LP#2162974
    <https://bugs.launchpad.net/neutron/+bug/2162974>`__, where a duplicated
    Logical_Switch could be created, leaving instances on it without a gateway
    or metadata.
  - |
    Updates Neutron container images to fix `LP#2150866
    <https://bugs.launchpad.net/neutron/+bug/2150866>`__, where floating IPs
    could stop working after an ovn-controller restart.
