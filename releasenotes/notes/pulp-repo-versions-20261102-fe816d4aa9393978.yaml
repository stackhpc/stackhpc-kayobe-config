---
security:
  - |
    Updates host package snapshots to latest available versions. This includes
    a Rocky Linux kernel fixing `CVE-2026-98432
    <https://nvd.nist.gov/vuln/detail/cve-2026-98432>__`. This kernel is
    available in the optional ``security`` repository: set
    ``dnf_enable_rocky_security`` to ``true`` to enable it.
